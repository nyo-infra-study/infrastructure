    legendFormat: failed spans
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 13
  title: OTel — Queue Usage %
  type: timeseries
  description: ''
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: max by (exporter) (otelcol_exporter_queue_size{service_name="otel-collector"}
      / otelcol_exporter_queue_capacity{service_name="otel-collector"})
    legendFormat: '{{exporter}}'
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
  - refId: B
    expr: vector(0.8)
    legendFormat: warning (80%)
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
  - refId: C
    expr: vector(0.95)
    legendFormat: critical (95%)
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 14
  title: OTel — Data Dropped by Filter (rate/s)
  type: timeseries
  description: Shows how many data points each filter drops per second. Only filters
    that actively remove data appear here.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: sum by (processor) (rate(otelcol_processor_incoming_items_total{service_name="otel-collector"}[$__rate_interval])
      - rate(otelcol_processor_outgoing_items_total{service_name="otel-collector"}[$__rate_interval]))
      > 0
    legendFormat: '{{processor}}'
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
