dashboard:
  title: Monitoring Stack
  uid: monitoring-meta
  tags:
  - monitoring
  - meta
  - observability
  - gigapipe
  - otel
  - clickhouse
  refresh: 10s
  time:
    from: now-1h
    to: now
variables:
- name: datasource
  type: datasource
  label: Datasource
  query: prometheus
- name: job
  type: query
  label: Job
  query:
    qryType: 1
    query: label_values(up, job)
- name: instance
  type: query
  label: Gigapipe Instance
  query:
    qryType: 1
    query: label_values(sent_rows_total, job)
- name: loki
  type: datasource
  label: Loki
  query: loki
- name: ds_clickhouse
  type: datasource
  label: ClickHouse
  query: grafana-clickhouse-datasource
widgets:
- id: 34
  title: Summary
  type: row
  collapsed: false
- id: 73
  title: Monitoring Stack
  type: text
  description: ''
  datasource:
    type: ''
    uid: ''
  queries: []
  content: '#### Flow


    OTel Collector → Gigapipe Writer → ClickHouse


    Grafana ← Gigapipe Readers ← ClickHouse


    ---


    #### Marks


    🟢 usage 🟡 request 🔴 limit


    ⚠️ Red line = OOMKill (mem) or throttle (cpu)

    '
- id: 63
  title: OTel CPU
  type: timeseries
  description: ''
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: avg(rate(container_cpu_usage_seconds_total{namespace="monitoring",pod=~".*otel.*",container!=""}[$__rate_interval]))
    legendFormat: usage
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
  - refId: B
    expr: avg(kube_pod_container_resource_requests{namespace="monitoring",pod=~".*otel.*",resource="cpu"})
    legendFormat: request
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
  - refId: C
    expr: avg(kube_pod_container_resource_limits{namespace="monitoring",pod=~".*otel.*",resource="cpu"})
    legendFormat: limit
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
