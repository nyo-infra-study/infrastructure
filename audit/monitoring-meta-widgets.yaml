- id: 1
  title: Pipeline Overview
  type: row
  collapsed: false
- id: 2
  title: Data Volume by Signal
  type: marcusolsson-treemap-panel
  description: Namespace (big box) → Service (small box inside). Size = bytes written.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: sum by (namespace, service) (sent_bytes_total{job=~"$instance"})
    legendFormat: '{{service}}'
    format: table
    instant: true
    range: true
    interval: ''
    intervalFactor: null
- id: 3
  title: Component Health
  type: grafana-polystat-panel
  description: At-a-glance health of all observability components. Green = healthy,
    Red = down.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: up{job=~"otel-collector|clickhouse|gigapipe.*"}
    legendFormat: '{{job}}'
    format: time_series
    instant: true
    range: true
    interval: ''
    intervalFactor: null
- id: 4
  title: ① Scraped (samples)
  type: stat
  description: Total samples scraped per scrape from selected jobs. This is a gauge
    showing samples per scrape, not a rate.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: sum(scrape_samples_scraped{job=~"$job"})
    legendFormat: ''
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 7
  title: Scrape Filter
  type: gauge
  description: How much Prometheus metric_relabel_configs drops at scrape time. Compares
    raw scraped samples vs samples after relabeling.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: clamp_min(1 - (sum(scrape_samples_post_metric_relabeling{job=~"$job"}) /
      sum(scrape_samples_scraped{job=~"$job"})), 0)
    legendFormat: ''
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 5
  title: ② Stored (rate/s)
  type: stat
  description: Metric points exported by OTel Collector to Gigapipe per second. AFTER
    filtering.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: sum(rate(otelcol_exporter_sent_metric_points_total{service_name="otel-collector"}[$__rate_interval]))
    legendFormat: ''
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 77
  title: Processor Filter
  type: gauge
  description: How much OTel processor filters drop. Compares what enters processors
    vs what gets exported.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: clamp_min(1 - (sum(rate(otelcol_exporter_sent_metric_points_total{service_name="otel-collector"}[$__rate_interval]))
      / sum(rate(otelcol_receiver_accepted_metric_points_total{service_name="otel-collector"}[$__rate_interval]))),
      0)
    legendFormat: ''
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 6
  title: ③ Queried (queries/s)
  type: stat
  description: ClickHouse SELECT queries per second.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: rate(ClickHouseProfileEvents_SelectQuery_total{service_name="clickhouse"}[$__rate_interval])
    legendFormat: ''
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 8
  title: CH Active Parts
  type: stat
  description: ClickHouse active parts count. High = merge pressure.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: ClickHouseMetrics_PartsActive{job="clickhouse"}
    legendFormat: ''
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 9
  title: CH Memory
  type: stat
  description: ClickHouse memory tracking.
  datasource:
    type: prometheus
    uid: ${datasource}
  queries:
  - refId: A
    expr: ClickHouseMetrics_MemoryTracking{job="clickhouse"}
    legendFormat: ''
    format: time_series
    instant: false
    range: true
    interval: ''
    intervalFactor: null
- id: 10
  title: OTel Collector
  type: row
  collapsed: false
