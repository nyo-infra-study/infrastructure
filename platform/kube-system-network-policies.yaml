# ============================================================
# Network Policies — kube-system Namespace
# ============================================================
# Covers k3d system workloads: CoreDNS, Traefik, metrics-server,
# local-path-provisioner, svclb (service load balancer).
#
# NOTE: DNS egress uses open port rules (no `to:` restriction)
# because ClusterIP-based DNS doesn't match pod selectors in
# k3d/k3s network policy implementations.
# ============================================================

# --- CoreDNS ---
# Ingress: DNS from all namespaces (open — every pod needs DNS)
# Egress: upstream DNS, K8s API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coredns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # All pods need DNS — allow from everywhere
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  egress:
    # Upstream DNS resolvers
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API (for service discovery)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# --- Traefik Ingress Controller ---
# Ingress: external traffic (HTTP/HTTPS)
# Egress: to all namespaces (routes to backend services), DNS, K8s API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # External traffic via load balancer
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9000
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Route to all backend services in all namespaces
    - to:
        - namespaceSelector: {}
    # K8s API (for ingress discovery)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# --- Metrics Server ---
# Ingress: from K8s API (aggregated API)
# Egress: to kubelets, DNS, K8s API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API server aggregation
    - ports:
        - protocol: TCP
          port: 4443
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubelet metrics (port 10250 on nodes)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 10250
    # K8s API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# --- Local Path Provisioner ---
# Egress: to K8s API, DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: local-path-provisioner
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# --- SVClb (Traefik Service Load Balancer) ---
# Ingress: external traffic
# Egress: to Traefik pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: svclb-traefik
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      svccontroller.k3s.cattle.io/svcname: traefik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # External traffic
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  egress:
    # Forward to Traefik
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
