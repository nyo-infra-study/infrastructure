# HTTPRoute for Grafana
# Exposes Grafana at http://grafana.localhost
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - grafana.localhost
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: dev-grafana
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
