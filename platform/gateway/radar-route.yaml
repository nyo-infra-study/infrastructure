# HTTPRoute for Radar
# Exposes Radar at http://radar.localhost
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radar
  namespace: monitoring
spec:
  hostnames:
    - radar.localhost
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: dev-monitoring-radar
          port: 9280
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
