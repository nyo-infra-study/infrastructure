# ============================================================
# Cilium CNI Configuration
# ============================================================
#
# INSTALLATION COMMAND:
# helm repo add cilium https://helm.cilium.io/
# helm install cilium oci://quay.io/cilium/charts/cilium --version 1.19.0 \
#   --namespace kube-system \
#   -f platform/cilium/values.yaml
#
# ============================================================

# Enable Hubble for network observability
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    # Ingress for Hubble UI
    ingress:
      enabled: true
      # No className needed as Cilium will be default
      hosts:
        - localhost
      path: /hubble
      annotations: {}

# Enable Cilium Ingress Controller
ingressController:
  enabled: true
  default: true # Make Cilium the default Ingress Class
  loadbalancerMode: shared
  enforceHttps: false
  hostNetwork:
    enabled: true
    sharedListenerPort: 30080 # Must match the k3d port mapping (8080:30080)
  service:
    # With hostNetwork, we don't need NodePort on the Service.
    # The Pod listens directly on the host port 30080.
    type: ClusterIP

# K3s Specific IPAM Configuration
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]

# Enable KubeProxy Replacement
kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
