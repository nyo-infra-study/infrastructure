# ============================================================
# Cilium Platform Configuration (k3d / k3s)
# ============================================================
# MANAGED BY: ArgoCD (apps/dev/cilium.yaml)
#
# CLUSTER SETUP (run.sh creates k3d with these k3s flags):
#   --disable=traefik          → Cilium replaces Traefik as ingress controller
#   --disable-kube-proxy       → Cilium fully replaces kube-proxy (eBPF)
#   --flannel-backend=none     → Cilium replaces Flannel as CNI
#   --disable-network-policy   → Cilium handles network policies
#
# PORT MAPPING RATIONALE:
#   k3d uses @server:0 (not @loadbalancer) so Docker binds host:9000 directly
#   to the k3d server node container's port 30080. This is required because:
#   - Cilium eBPF NodePort does NOT open a real TCP socket (no kernel listener)
#   - k3d's nginx @loadbalancer proxies to server-node:80 which has no listener
#   - svclb (klipper-lb) DNAT rules live in the svclb container's own netns,
#     not the server node's host netns, so they don't affect nginx's path
#   - @server:0 makes Docker bind the port at container level so traffic arrives
#     on the server node's eth0, where Cilium's tc-bpf NodePort hook IS active
# ============================================================

# Kube-proxy replacement (eBPF mode)
# k3d is created with --disable-kube-proxy, so Cilium takes full ownership.
# k8sServiceHost and k8sServicePort are NOT set here — they are DYNAMIC
# (k3d assigns a docker bridge IP to the server node that changes per run).
# run.sh detects and injects them via 'helm install --set ...' at deploy time.
kubeProxyReplacement: true

# --- IPAM ---
# Use cluster-pool mode to match k3s default pod CIDR (10.42.0.0/16)
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.42.0.0/16"

# Fixes 503 Service Unavailable by bypassing the eBPF host routing bug
# when Envoy and backend pods are on the same node (always true in k3d single-node).
bpf:
  hostLegacyRouting: true

# --- Cilium Ingress Controller (replaces Traefik) ---
ingressController:
  enabled: true
  # dedicated mode puts Envoy in the pod network, avoiding k3d host-routing timeouts
  loadbalancerMode: dedicated
  # Make cilium the default ingress class
  default: true
  # Fixed NodePorts so k3d can map them predictably at cluster creation time.
  # Without fixed ports the dynamic NodePort can't be known before the cluster exists.
  # k3d maps: localhost:9000 → server-container:30080 → Cilium tc-bpf NodePort → Envoy
  service:
    insecureNodePort: 30080 # HTTP
    secureNodePort: 30443 # HTTPS

# --- NodePort / HostPort (for k3d port mapping) ---
hostPort:
  enabled: true

nodePort:
  enabled: true

# --- Operator ---
operator:
  replicas: 1
