# ============================================================
# ArgoCD Platform Configuration
# ============================================================
# These values customize the ArgoCD Helm chart installation.
#
# INSTALLATION COMMAND:
# helm install argocd argo/argo-cd -n argocd --create-namespace -f platform/argocd/values.yaml
#
# UPGRADES:
# helm upgrade argocd argo/argo-cd -n argocd -f platform/argocd/values.yaml
#
# ACCESS:
# - URL: http://argocd.localhost
# - Username: admin
# - Password: kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath="{.data.password}" | base64 -d
#
# WHY THESE SETTINGS?
# - server.insecure: Allows HTTP access (no TLS for local development)
# - ingress disabled: We use Gateway API HTTPRoute instead (platform/gateway/)
# ============================================================

configs:
  params:
    # Disable TLS/HTTPS requirement for ArgoCD server
    # This allows HTTP access (needed for local development)
    # IMPORTANT: In production, set this to false and use TLS
    server.insecure: true

server:
  extraArgs: []

  # Enable metrics service for OTel scraping
  metrics:
    enabled: true
    service:
      type: ClusterIP
      servicePort: 8083

  # Ingress disabled — we use Gateway API HTTPRoute (see platform/gateway/argocd-route.yaml)
  ingress:
    enabled: false

controller:
  metrics:
    enabled: true
    service:
      type: ClusterIP
      servicePort: 8082

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  metrics:
    enabled: true
    service:
      type: ClusterIP
      servicePort: 8084
  # Fix: default liveness probe timeout (1s) is too aggressive.
  # Repo-server becomes unresponsive during heavy Helm rendering / git ops.
  livenessProbe:
    httpGet:
      path: /healthz?full=false
      port: metrics
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
