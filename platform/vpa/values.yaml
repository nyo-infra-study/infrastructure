# ============================================================
# Vertical Pod Autoscaler Controller (Local Dev)
# ============================================================
# Chart: cowboysysop/vertical-pod-autoscaler v11.1.1
# Installs VPA CRDs + controller components (recommender, updater, admission).
#
# VPA policies live inside each app for ArgoCD visibility:
#   Local charts  → charts/<app>/templates/vpa.yaml
#   Upstream charts → platform/monitoring/<app>/vpa.yaml (multi-source)
# ============================================================

# Admission controller: validates and mutates pod resource requests
admissionController:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# Recommender: computes resource recommendations from metrics
recommender:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 512Mi

# Updater: evicts pods to apply new recommendations
updater:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
