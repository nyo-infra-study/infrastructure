# ============================================================
# Tempo — Distributed Tracing (Local Dev, Single Binary)
# ============================================================
# Chart: grafana/tempo v1.24.4
# Receives traces via OTLP from OTel Collector
# ============================================================

tempo:
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      memory: 1Gi
  # Accept OTLP gRPC and HTTP
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  # Enable metrics generator for Grafana Traces Drilldown
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://dev-lgtm-prometheus-server.monitoring.svc.cluster.local:80/api/v1/write"
    processor:
      local_blocks:
        filter_server_spans: false
      service_graphs:
        dimensions:
          - service.name
          - http.method
          - http.status_code
      span_metrics:
        dimensions:
          - service.name
          - http.method
          - http.status_code
          - http.route

  # Override defaults to enable metrics generator for all tenants
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  # Retention — auto-delete traces older than 72h
  compactor:
    compaction:
      block_retention: 72h

# Single binary mode
replicas: 1
