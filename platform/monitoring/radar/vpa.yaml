# VPA Policy for Radar
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-radar
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-monitoring-radar
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: radar
        minAllowed:
          cpu: 10m
          memory: 32Mi
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: 300m
          memory: 512Mi
