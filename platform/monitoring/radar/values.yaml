# ============================================================
# Radar by Skyhook — Kubernetes Visibility UI (Local Dev)
# ============================================================
# Chart: https://github.com/skyhook-io/helm-charts (skyhook/radar v1.7.1)
# Docs:  https://radarhq.io/docs
#
# UI accessible at: http://radar.localhost
#
# Features: Topology visualization, resource browser, event timeline,
# Helm management, GitOps (ArgoCD/FluxCD), traffic maps, cluster audit,
# image filesystem viewer, and MCP for AI agents.
# ============================================================

replicaCount: 1

image:
  repository: ghcr.io/skyhook-io/radar
  tag: "1.7.1"
  pullPolicy: IfNotPresent

# --- Service ---
service:
  type: ClusterIP
  port: 9280

# --- Ingress (disabled — using Gateway API HTTPRoute in platform/gateway/) ---
ingress:
  enabled: false

# --- Resources (lightweight for local dev) ---
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

# --- RBAC ---
rbac:
  create: true
  # PCI DSS hardening: disable access to sensitive data and container shells
  secrets: false
  podExec: false
  podLogs: false
  portForward: false
  helm: false
  viewRBAC: true
  traffic: true
  metrics: true
  # CRD access — enable ArgoCD since we use it
  crdGroups:
    all: false
    argo: true
    certManager: true
    flux: true
    gatewayApi: true
    prometheus: true
    traefik: true
  additionalCrdGroups:
    - autoscaling.k8s.io

# --- Timeline ---
timeline:
  storage: memory
  historyLimit: 10000

# --- Auth (disabled for local dev) ---
auth:
  mode: none

# --- MCP (AI integration — enabled) ---
mcp:
  enabled: true

# --- Traffic source ---
# Caretta is disabled in k3d (eBPF tracepoints unavailable).
# On a real cluster, re-enable Caretta and uncomment:
# traffic:
#   prometheusUrl: "http://caretta-vm-victoria-metrics-single-server.monitoring.svc.cluster.local:8428"

# --- Persistence (not needed for memory timeline) ---
persistence:
  enabled: false

# --- Cloud (disabled — standalone OSS) ---
cloud:
  enabled: false
