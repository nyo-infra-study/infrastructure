# ============================================================
# Grafana — Gigapipe Backend (Local Dev)
# ============================================================
# Chart: grafana/grafana v10.5.15
# UI: http://grafana.localhost
# Default login: admin / admin
#
# Uses standard Loki/Prometheus/Tempo datasources pointing to Gigapipe.
# Two sets of datasources:
#   1. PCI (Gigapipe Writer) — sees all data
#   2. Non-PCI (Gigapipe Reader) — sees only non-pci data
# ============================================================

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 194Mi
  limits:
    cpu: 200m
    memory: 384Mi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.localhost

# Pre-configure datasources (standard Loki/Prometheus/Tempo — no special plugins needed)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # ════════════════════════════════════════════
      # PCI datasources (Gigapipe Writer — full access)
      # ════════════════════════════════════════════
      - name: "Prometheus (PCI)"
        type: prometheus
        uid: prometheus-pci
        url: http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100
        isDefault: true
        access: proxy
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo-pci
              name: trace_id

      - name: "Loki (PCI)"
        type: loki
        uid: loki-pci
        url: http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo-pci
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      - name: "Tempo (PCI)"
        type: tempo
        uid: tempo-pci
        url: http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki-pci
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus-pci
          nodeGraph:
            enabled: true

      # ════════════════════════════════════════════
      # Non-PCI datasources (Gigapipe Reader — restricted)
      # ════════════════════════════════════════════
      - name: "Prometheus (Non-PCI)"
        type: prometheus
        uid: prometheus-nonpci
        url: http://dev-monitoring-gigapipe-reader.monitoring.svc.cluster.local:3100
        access: proxy

      - name: "Loki (Non-PCI)"
        type: loki
        uid: loki-nonpci
        url: http://dev-monitoring-gigapipe-reader.monitoring.svc.cluster.local:3100
        access: proxy

      - name: "Tempo (Non-PCI)"
        type: tempo
        uid: tempo-nonpci
        url: http://dev-monitoring-gigapipe-reader.monitoring.svc.cluster.local:3100
        access: proxy

# Disable test framework
testFramework:
  enabled: false

# Admin password (local dev)
adminPassword: admin
