# ============================================================
# Grafana — Gigapipe Backend (Local Dev)
# ============================================================
# Chart: grafana/grafana v10.5.15
# UI: http://grafana.localhost
# Default login: admin / admin
#
# Datasources:
#   - Prometheus     → Reader PCI (metrics are the same for both users)
#   - Tempo          → Reader PCI (traces are the same for both users)
#   - Loki (PCI)     → Reader PCI (all logs including PCI)
#   - Loki (Non-PCI) → Reader Non-PCI (PCI logs filtered out)
#
# Only logs differ between PCI and Non-PCI. Metrics and traces
# are unrestricted for both ClickHouse users.
# ============================================================

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 194Mi
  limits:
    cpu: 200m
    memory: 384Mi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.localhost

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # ── Metrics (single source, no PCI restriction) ──
      - name: "Prometheus"
        type: prometheus
        uid: prometheus
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        isDefault: true
        access: proxy
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: trace_id

      # ── Traces (single source, no PCI restriction) ──
      - name: "Tempo"
        type: tempo
        uid: tempo
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki-pci
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

      # ── Logs PCI (all logs, including PCI-scoped) ──
      - name: "Loki (PCI)"
        type: loki
        uid: loki-pci
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      # ── Logs Non-PCI (PCI logs hidden by ClickHouse row policy) ──
      - name: "Loki (Non-PCI)"
        type: loki
        uid: loki-nonpci
        url: http://dev-monitoring-gigapipe-reader-nonpci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      # ── Profiles (continuous profiling via Gigapipe's Pyroscope API) ──
      - name: "Pyroscope"
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy

# Disable test framework
testFramework:
  enabled: false

# Admin password (local dev)
adminPassword: admin

# ── Dashboard Provisioning (auto-loaded from ConfigMaps) ──
# The sidecar watches for ConfigMaps with label grafana_dashboard=1
# and loads their JSON content as dashboards on startup.
# Dashboards are idempotent: same UID = overwrite, new UID = create.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    provider:
      allowUiUpdates: true
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Dashboards are auto-provisioned from ConfigMaps (created by kustomize
# in platform/monitoring/grafana-gigapipe/dashboards/kustomization.yaml).
# The sidecar picks up any ConfigMap with label grafana_dashboard=1.
# To add a new dashboard: drop a .json file in the dashboards/ folder
# and add it to kustomization.yaml.
