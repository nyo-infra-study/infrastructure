# ============================================================
# Grafana — Gigapipe Backend (Local Dev)
# ============================================================
# Chart: grafana/grafana v10.5.15
# UI: http://grafana.localhost
# Default login: admin / admin
#
# Datasources:
#   - Prometheus     → Reader PCI (metrics are the same for both users)
#   - Tempo          → Reader PCI (traces are the same for both users)
#   - Loki (PCI)     → Reader PCI (all logs including PCI)
#   - Loki (Non-PCI) → Reader Non-PCI (PCI logs filtered out)
#
# Only logs differ between PCI and Non-PCI. Metrics and traces
# are unrestricted for both ClickHouse users.
# ============================================================

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 194Mi
  limits:
    cpu: 200m
    memory: 384Mi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.localhost

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # ── Metrics (single source, no PCI restriction) ──
      - name: "Prometheus"
        type: prometheus
        uid: prometheus
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        isDefault: true
        access: proxy
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: trace_id

      # ── Traces (single source, no PCI restriction) ──
      - name: "Tempo"
        type: tempo
        uid: tempo
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki-pci
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

      # ── Logs PCI (all logs, including PCI-scoped) ──
      - name: "Loki (PCI)"
        type: loki
        uid: loki-pci
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      # ── Logs Non-PCI (PCI logs hidden by ClickHouse row policy) ──
      - name: "Loki (Non-PCI)"
        type: loki
        uid: loki-nonpci
        url: http://dev-monitoring-gigapipe-reader-nonpci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      # ── Profiles (continuous profiling via Gigapipe's Pyroscope API) ──
      - name: "Pyroscope"
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy

# Disable test framework
testFramework:
  enabled: false

# Admin password (local dev)
adminPassword: admin
