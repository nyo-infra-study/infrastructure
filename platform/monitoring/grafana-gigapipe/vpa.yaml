# VPA Policy for Grafana (Gigapipe backend)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-grafana-gigapipe
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-grafana-gigapipe
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: grafana
        minAllowed:
          cpu: 10m
          memory: 128Mi
        maxAllowed:
          cpu: 300m
          memory: 512Mi
