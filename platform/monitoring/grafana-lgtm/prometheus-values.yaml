# ============================================================
# Prometheus — Metrics (Local Dev)
# ============================================================
# Using Prometheus instead of Mimir for lightweight local dev.
# Receives metrics via OTLP remote write from OTel Collector.
# ============================================================

# We don't need Prometheus to scrape anything — OTel Collector does that.
# Prometheus just stores metrics received via remote write.
server:
  resources:
    requests:
      cpu: 10m
      memory: 302Mi
    limits:
      cpu: 200m
      memory: 512Mi
  persistentVolume:
    enabled: true
    size: 2Gi
  # Enable OTLP write receiver
  extraFlags:
    - "web.enable-remote-write-receiver"
    - "web.enable-lifecycle"
    - "enable-feature=otlp-write-receiver"

# Disable all scrapers (OTel Collector handles scraping)
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

# Disable default scrape configs (OTel Collector does all scraping)
serverFiles:
  prometheus.yml:
    scrape_configs: []
