# ============================================================
# Tempo — Distributed Tracing (Local Dev)
# ============================================================
# Uses the grafana/tempo chart.
# Push traces to (from within cluster via OTel Collector or directly):
#   http://dev-monitoring-tempo:4317  (OTLP gRPC)
#   http://dev-monitoring-tempo:4318  (OTLP HTTP)
# ============================================================

# Single-binary mode image config
image:
  repository: grafana/tempo
  tag: 2.3.1

tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

# Persistence for local dev
persistence:
  enabled: true
  size: 512Mi

# Small resource limits for local dev
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
