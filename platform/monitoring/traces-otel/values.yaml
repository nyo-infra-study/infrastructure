# ============================================================
# OpenTelemetry Collector (Local Dev)
# ============================================================
# Uses the open-telemetry/opentelemetry-collector chart.
# Receives all telemetry and forwards to SigNoz:
#  - Metrics -> SigNoz OTel Collector
#  - Logs -> SigNoz OTel Collector
#  - Traces -> SigNoz OTel Collector
# ============================================================
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.119.0

mode: deployment
replicaCount: 1

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: 'kubernetes-nodes'
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics

          - job_name: 'kubernetes-cadvisor'
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor

          - job_name: 'kube-state-metrics'
            static_configs:
              - targets: ['dev-monitoring-ksm-kube-state-metrics.monitoring.svc.cluster.local:8080']

          - job_name: 'node-exporter'
            static_configs:
              - targets: ['dev-monitoring-node-exporter-prometheus-node-exporter.monitoring.svc.cluster.local:9100']

  processors:
    batch:
      send_batch_size: 10000
      timeout: 2s

  exporters:
    # All telemetry goes to SigNoz OTel Collector via OTLP
    otlp/signoz:
      endpoint: "dev-monitoring-signoz-otel-collector.monitoring.svc.cluster.local:4317"
      tls:
        insecure: true

  service:
    pipelines:
      # Metrics pipeline — primary focus
      metrics:
        receivers: [otlp, prometheus]
        processors: [batch]
        exporters: [otlp/signoz]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/signoz]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/signoz]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions", "networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
