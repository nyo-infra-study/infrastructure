# VPA Policy for ClickHouse (monitoring storage)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-monitoring-clickhouse
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: dev-monitoring-clickhouse
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: clickhouse
        minAllowed:
          cpu: 50m
          memory: 256Mi
        maxAllowed:
          cpu: "2"
          memory: 4Gi
