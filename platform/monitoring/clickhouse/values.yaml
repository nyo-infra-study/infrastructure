# ============================================================
# ClickHouse — Observability Storage (Local Dev)
# ============================================================
# Chart: altinity/clickhouse v0.3.11 (app v25.3.6)
# Image: altinity/clickhouse-server (official, from Docker Hub)
# Single-node ClickHouse for storing OTel signals.
#
# Single database: otel
# Multi-tenancy via row policies on materialized tenant_scope column.
#
# After tables are auto-created by the OTel exporter, run
# setup-policies.sql to add materialized columns + row policies.
# ============================================================

clickhouse:
  shardsCount: 1
  replicasCount: 1

  defaultUser:
    password: clickhouse123
    allowExternalAccess: true

  # Additional users for multi-tenancy (row policies applied separately)
  users:
    - name: user_all
      hostIP: ["0.0.0.0/0"]
      grants:
        - "GRANT SELECT ON otel.*"
    - name: user_nonpci
      hostIP: ["0.0.0.0/0"]
      grants:
        - "GRANT SELECT ON otel.*"

  image:
    repository: altinity/clickhouse-server
    tag: "25.3.6.10034.altinitystable"
    pullPolicy: IfNotPresent

  persistence:
    enabled: true
    size: 5Gi

  service:
    type: ClusterIP

  resources:
    cpuRequestsMs: 100
    memoryRequestsMi: 512
    cpuLimitsMs: 2000
    memoryLimitsMi: 2048

  # Init scripts to create the otel database
  initScripts:
    01-init.sql: |
      CREATE DATABASE IF NOT EXISTS otel;

# Disable keeper for single-node (no replication)
keeper:
  enabled: false
