# ============================================================
# ClickHouse — Observability Storage (Local Dev)
# ============================================================
# Chart: local charts/clickhouse (minimal StatefulSet)
# Image: clickhouse/clickhouse-server:25.7-alpine (official)
#
# Single database: otel
# Multi-tenancy via row policies on materialized tenant_scope column.
#
# After tables are auto-created by the OTel exporter, run
# setup-policies.sql to add materialized columns + row policies.
# ============================================================

image:
  repository: clickhouse/clickhouse-server
  tag: "25.7.8-alpine"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 500m
    memory: 1.5Gi
  limits:
    memory: 3Gi

persistence:
  enabled: true
  size: 5Gi

service:
  type: ClusterIP

ingress:
  enabled: true
  host: "clickhouse.localhost"

# Auto-run setup-policies after Gigapipe creates tables
setupPolicies:
  enabled: true

auth:
  defaultPassword: clickhouse123

# Init scripts run on first boot (mounted to /docker-entrypoint-initdb.d)
initScripts:
  01-init-database.sql: |
    CREATE DATABASE IF NOT EXISTS otel;
  02-init-users.sql: |
    -- user_all: full access (PCI + non-PCI, all signals including logs)
    CREATE USER IF NOT EXISTS user_all IDENTIFIED BY 'all_pass';
    -- user_nonpci: all metrics + traces, but PCI logs are hidden
    CREATE USER IF NOT EXISTS user_nonpci IDENTIFIED BY 'nonpci_pass';
    GRANT SELECT ON otel.* TO user_all;
    GRANT SELECT ON otel.* TO user_nonpci;
    GRANT SELECT ON system.* TO user_all;
    GRANT SELECT ON system.* TO user_nonpci;
