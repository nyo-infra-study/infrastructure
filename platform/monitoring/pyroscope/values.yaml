# ============================================================
# Pyroscope — Continuous Profiling (Local Dev)
# ============================================================
# Chart: grafana/pyroscope v2.0.1
# Receives profiling data from instrumented apps.
# UI: via Grafana Profiles Drilldown
# ============================================================

pyroscope:
  extraArgs:
    store-gateway.sharding-ring.replication-factor: "1"
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Alloy sidecar (scrapes profiling targets and sends to Pyroscope)
alloy:
  resources:
    requests:
      cpu: 60m
      memory: 256Mi
    limits:
      cpu: 600m
      memory: 512Mi

# Single binary mode for local dev
minio:
  enabled: false

# Use filesystem storage
storage:
  backend: filesystem

# Disable components not needed in monolithic mode
ingester:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
querier:
  replicas: 0
query-frontend:
  replicas: 0
query-scheduler:
  replicas: 0
store-gateway:
  replicas: 0

# VPAs — deployed alongside the workloads they target
extraObjects:
  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-pyroscope
      namespace: monitoring
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: StatefulSet
        name: dev-pyroscope
      updatePolicy:
        updateMode: Auto
      resourcePolicy:
        containerPolicies:
          - containerName: pyroscope
            minAllowed:
              cpu: 10m
              memory: 128Mi
            maxAllowed:
              cpu: 500m
              memory: 512Mi
  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-pyroscope-alloy
      namespace: monitoring
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: StatefulSet
        name: dev-pyroscope-alloy
      updatePolicy:
        updateMode: Auto
      resourcePolicy:
        containerPolicies:
          - containerName: alloy
            minAllowed:
              cpu: 20m
              memory: 128Mi
            maxAllowed:
              cpu: 300m
              memory: 384Mi
