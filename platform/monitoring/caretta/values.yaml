# ============================================================
# Caretta — eBPF-based K8s Traffic Visibility (Local Dev)
# ============================================================
# Chart: https://helm.groundcover.com (groundcover/caretta v0.0.16)
# Docs:  https://github.com/groundcover-com/caretta
#
# Provides lightweight eBPF-based service-to-service traffic mapping.
# Radar auto-detects Caretta as a traffic data source for its
# Traffic view (topology + animated flow graph).
#
# Victoria Metrics is deployed separately (monitoring-caretta-vm app)
# using a modern chart version without PSP issues.
#
# NOTE: Requires Linux kernel >= 4.16 with CO-RE support.
# Works in k3d/Colima (Linux VM) but NOT natively on Docker for Mac.
# ============================================================

# --- Caretta Agent ---
image:
  repository: quay.io/groundcover/caretta
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 50Mi
  limits:
    cpu: 150m
    memory: 300Mi

# Disable PodSecurityPolicy (removed in K8s 1.25+)
rbac:
  pspEnabled: false
  sccEnabled: false

# Polling interval for eBPF metrics (seconds)
pollIntervalSeconds: 5

# Resolve K8s entities to their owners (pod → deployment)
traverseUpHierarchy: true

# DNS resolving for external connections
enableDnsResolving: true

# Tolerate control-plane nodes
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# --- Victoria Metrics (DISABLED — deployed separately to avoid PSP issues) ---
victoria-metrics-single:
  enabled: false

# --- Grafana (disabled — Radar provides the visualization) ---
grafana:
  enabled: false
