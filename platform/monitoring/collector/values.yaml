# ============================================================
# OpenTelemetry Collector — Base Config (Local Dev)
# ============================================================
# Image, mode, security, volumes, resources, and RBAC.
# Receiver/processor/exporter/pipeline config lives in
# separate files — see README.md for the full layout.
# ============================================================
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.119.0

# DaemonSet mode required for filelog receiver (reads host log files)
mode: daemonset

# Expose the collector as a service so apps can send OTLP to it
service:
  enabled: true

# ── Security hardening ──
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  automountServiceAccountToken: true

# ── Host log mounts (required for filelog receiver) ──
extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlogcontainers
    hostPath:
      path: /var/log/containers

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlogcontainers
    mountPath: /var/log/containers
    readOnly: true

# Expected usage with all features: ~50m CPU, ~350Mi memory
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
      verbs: ["get", "list", "watch"]
    # Required for k8sattributes processor
    - apiGroups: ["apps"]
      resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions", "networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
