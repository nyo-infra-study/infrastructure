# ============================================================
# OpenTelemetry Collector (Local Dev — Lightweight)
# ============================================================
# Uses the open-telemetry/opentelemetry-collector chart.
# Receives OTLP telemetry from apps and forwards to OneUptime.
#
# This is a minimal config for local dev that only handles:
#  - OTLP metrics/traces/logs from instrumented apps (backend-server, etc.)
#  - OTel Collector internal metrics
#  - Forwarding to OneUptime
#
# Heavy infra scraping (kubelet, cAdvisor, KSM, node-exporter)
# and pod log collection are disabled to save resources locally.
# Re-enable the commented sections below if you need full observability.
# ============================================================
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.119.0

# Switched to deployment since filelog (which needs DaemonSet) is disabled.
# Change back to "daemonset" if re-enabling filelog receiver.
mode: deployment

# Expose the collector as a service so apps can send OTLP to it
service:
  enabled: true

# ── Host log mounts (disabled — not needed without filelog receiver) ──
# extraVolumes:
#   - name: varlogpods
#     hostPath:
#       path: /var/log/pods
#   - name: varlogcontainers
#     hostPath:
#       path: /var/log/containers

# extraVolumeMounts:
#   - name: varlogpods
#     mountPath: /var/log/pods
#     readOnly: true
#   - name: varlogcontainers
#     mountPath: /var/log/containers
#     readOnly: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # ── Collector self-metrics (lightweight — scrapes its own /metrics) ──
    # Gives you otelcol_* metrics to monitor collector health and resource usage
    # before turning on heavier sources.
    prometheus/self:
      config:
        scrape_configs:
          - job_name: 'otel-collector-self'
            scrape_interval: 30s
            static_configs:
              - targets: ['localhost:8888']

    # ── cAdvisor (OOM kills + CPU throttling + memory/cpu usage) ──
    prometheus/cadvisor:
      config:
        scrape_configs:
          - job_name: 'kubernetes-cadvisor'
            scheme: https
            scrape_interval: 30s
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor

    # ── KSM (resource requests/limits to compare against actual usage) ──
    prometheus/ksm:
      config:
        scrape_configs:
          - job_name: 'kube-state-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-ksm-kube-state-metrics.monitoring.svc.cluster.local:8080']

    # ── Prometheus scrape jobs (disabled — kubelet + node-exporter too heavy for local dev) ──
    # prometheus/kubelet:
    #   config:
    #     scrape_configs:
    #       - job_name: 'kubernetes-nodes'
    #         scheme: https
    #         tls_config:
    #           ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    #           insecure_skip_verify: true
    #         bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    #         kubernetes_sd_configs:
    #           - role: node
    #         relabel_configs:
    #           - action: labelmap
    #             regex: __meta_kubernetes_node_label_(.+)
    #           - target_label: __address__
    #             replacement: kubernetes.default.svc:443
    #           - source_labels: [__meta_kubernetes_node_name]
    #             regex: (.+)
    #             target_label: __metrics_path__
    #             replacement: /api/v1/nodes/${1}/proxy/metrics
    #
    # prometheus/node-exporter:
    #   config:
    #     scrape_configs:
    #       - job_name: 'node-exporter'
    #         static_configs:
    #           - targets: ['dev-monitoring-node-exporter-prometheus-node-exporter.monitoring.svc.cluster.local:9100']

    # ── Pod log collection (disabled — heavy for local dev) ──
    # filelog:
    #   include:
    #     - /var/log/pods/*/*/*.log
    #   exclude:
    #     - /var/log/pods/monitoring_dev-monitoring-otel-*/**/*.log
    #     - /var/log/pods/monitoring_dev-monitoring-signoz-*/**/*.log
    #     - /var/log/pods/monitoring_chi-*/**/*.log
    #     - /var/log/pods/monitoring_signoz-*/**/*.log
    #   start_at: end
    #   include_file_path: true
    #   include_file_name: false
    #   operators:
    #     - type: router
    #       id: get-format
    #       routes:
    #         - output: parser-containerd
    #           expr: 'body matches "^[^ Z]+ "'
    #         - output: parser-docker
    #           expr: 'body matches "^\\{"'
    #       default: parser-containerd
    #
    #     - type: regex_parser
    #       id: parser-containerd
    #       regex: '^(?P<time>[^ Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)'
    #       timestamp:
    #         parse_from: attributes.time
    #         layout: '%Y-%m-%dT%H:%M:%S.%LZ'
    #       output: extract-metadata
    #
    #     - type: json_parser
    #       id: parser-docker
    #       output: extract-metadata
    #       timestamp:
    #         parse_from: attributes.time
    #         layout: '%Y-%m-%dT%H:%M:%S.%LZ'
    #
    #     - type: regex_parser
    #       id: extract-metadata
    #       regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/.*'
    #       parse_from: attributes["log.file.path"]
    #
    #     - type: move
    #       from: attributes.log
    #       to: body
    #
    #     - type: move
    #       from: attributes.stream
    #       to: attributes["log.iostream"]
    #
    #     - type: move
    #       from: attributes.namespace
    #       to: resource["k8s.namespace.name"]
    #
    #     - type: move
    #       from: attributes.pod_name
    #       to: resource["k8s.pod.name"]
    #
    #     - type: move
    #       from: attributes.container_name
    #       to: resource["k8s.container.name"]
    #
    #     - type: move
    #       from: attributes.uid
    #       to: resource["k8s.pod.uid"]
    #
    #     - type: remove
    #       field: attributes.time
    #     - type: remove
    #       field: attributes.logtag

  processors:
    batch:
      send_batch_size: 10000
      timeout: 2s

    # ── Set service.name for scraped metrics ──────────────────
    # OneUptime requires service.name to query metrics in chart widgets.
    # Without this, metrics appear in explorer but not in dashboards.
    resource/self:
      attributes:
        - key: service.name
          value: "otel-collector"
          action: upsert

    resource/cadvisor:
      attributes:
        - key: service.name
          value: "kubernetes-cadvisor"
          action: upsert

    resource/ksm:
      attributes:
        - key: service.name
          value: "kube-state-metrics"
          action: upsert

    # ── Enrich logs with k8s metadata (disabled — not needed without filelog) ──
    # k8sattributes:
    #   auth_type: "serviceAccount"
    #   passthrough: false
    #   extract:
    #     metadata:
    #       - k8s.namespace.name
    #       - k8s.pod.name
    #       - k8s.pod.uid
    #       - k8s.deployment.name
    #       - k8s.statefulset.name
    #       - k8s.daemonset.name
    #       - k8s.node.name
    #       - k8s.container.name
    #   pod_association:
    #     - sources:
    #         - from: resource_attribute
    #           name: k8s.pod.uid

    # ── Filter logs: drop noisy namespaces (disabled — not needed without filelog) ──
    # filter/logs:
    #   error_mode: ignore
    #   logs:
    #     log_record:
    #       - 'resource.attributes["k8s.namespace.name"] == "kube-system"'
    #       - 'resource.attributes["k8s.namespace.name"] == "argocd"'

    # ── Drop noisy / low-value metrics (for app OTLP metrics) ──
    filter/metrics:
      error_mode: ignore
      metrics:
        metric:
          # --- Go runtime noise from app instrumentation ---
          - 'IsMatch(name, "go_gc_.*")'
          - 'IsMatch(name, "go_sched_.*")'
          - 'IsMatch(name, "go_cpu_.*")'
          - 'name == "go_threads"'
          - 'name == "go_info"'
          # --- process metrics ---
          - 'IsMatch(name, "process_.*")'
          # --- scrape meta ---
          - 'name == "scrape_duration_seconds"'
          - 'name == "scrape_samples_scraped"'
          - 'name == "scrape_samples_post_metric_relabeling"'
          - 'name == "scrape_series_added"'
          - 'name == "up"'

    # ── Keep only useful cAdvisor + KSM metrics (allowlist approach) ──
    # cAdvisor: OOM kills, CPU throttling, memory/cpu usage
    # KSM: resource requests/limits so you can compare usage vs allocation
    filter/infra-allow:
      error_mode: ignore
      metrics:
        metric:
          # KEEP only these — drop everything else from cAdvisor + KSM
          # This is a deny filter, so we drop metrics that DON'T match our allowlist
          - 'not(IsMatch(name, "container_cpu_usage_seconds_total") or IsMatch(name, "container_memory_usage_bytes") or IsMatch(name, "container_memory_working_set_bytes") or IsMatch(name, "container_oom_events_total") or IsMatch(name, "container_cpu_cfs_throttled_periods_total") or IsMatch(name, "container_cpu_cfs_periods_total") or IsMatch(name, "kube_pod_container_resource_requests") or IsMatch(name, "kube_pod_container_resource_limits") or IsMatch(name, "kube_pod_container_status_restarts_total") or IsMatch(name, "kube_pod_container_status_last_terminated_reason") or IsMatch(name, "kube_pod_status_phase") or IsMatch(name, "kube_container_status_waiting_reason") or IsMatch(name, "scrape_.*") or name == "up")'
          # Now drop scrape meta from the allowed set
          - 'name == "scrape_duration_seconds"'
          - 'name == "scrape_samples_scraped"'
          - 'name == "scrape_samples_post_metric_relabeling"'
          - 'name == "scrape_series_added"'
          - 'name == "up"'

    # ── Remove high-cardinality labels (disabled — mainly for prometheus scrapes) ──
    # transform/drop_labels:
    #   metric_statements:
    #     - context: datapoint
    #       statements:
    #         - delete_key(attributes, "id")
    #         - delete_key(attributes, "image")
    #         - delete_key(attributes, "uid")
    #         - delete_key(attributes, "instance")
    #         - delete_key(attributes, "prometheus_replica")

  exporters:
    # Send to OneUptime OTLP endpoint (app service exposes gRPC on 4317)
    otlp/oneuptime:
      endpoint: "dev-monitoring-oneuptime-app.monitoring.svc.cluster.local:4317"
      headers:
        x-oneuptime-token: "5adfffe8-f0f6-440a-bf4e-55d304a20ba5"
      tls:
        insecure: true

  service:
    # Enable internal telemetry so the collector emits otelcol_* metrics on :8888
    telemetry:
      metrics:
        address: 0.0.0.0:8888
        level: normal

    pipelines:
      # ── Infra metrics pipeline (disabled — kubelet + node-exporter) ──
      # metrics/kubelet:
      #   receivers: [prometheus/kubelet]
      #   processors: [filter/infra-allow, batch]
      #   exporters: [otlp/oneuptime]

      # Collector self-metrics (otelcol_* — monitor the collector's own resource usage)
      metrics/self:
        receivers: [prometheus/self]
        processors: [resource/self, batch]
        exporters: [otlp/oneuptime]
      # cAdvisor metrics (OOM, CPU throttle, memory/cpu usage)
      metrics/cadvisor:
        receivers: [prometheus/cadvisor]
        processors: [resource/cadvisor, filter/infra-allow, batch]
        exporters: [otlp/oneuptime]
      # KSM metrics (resource requests/limits, pod status)
      metrics/ksm:
        receivers: [prometheus/ksm]
        processors: [resource/ksm, filter/infra-allow, batch]
        exporters: [otlp/oneuptime]
      # App metrics from OTLP (backend-server, oneuptime components, etc.)
      metrics:
        receivers: [otlp]
        processors: [filter/metrics, batch]
        exporters: [otlp/oneuptime]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/oneuptime]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/oneuptime]

# Observed usage: ~22m CPU, ~157Mi memory (with cadvisor + ksm scraping)
resources:
  requests:
    cpu: 22m
    memory: 157Mi
  limits:
    cpu: 300m
    memory: 256Mi

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
      verbs: ["get", "list", "watch"]
    # ── Extended RBAC for k8sattributes processor (disabled) ──
    # - apiGroups: ["apps"]
    #   resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    #   verbs: ["get", "list", "watch"]
    # - apiGroups: ["extensions", "networking.k8s.io"]
    #   resources: ["ingresses"]
    #   verbs: ["get", "list", "watch"]
    # - apiGroups: ["batch"]
    #   resources: ["jobs"]
    #   verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
