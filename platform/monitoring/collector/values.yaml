# ============================================================
# OpenTelemetry Collector (Local Dev)
# ============================================================
# Uses the open-telemetry/opentelemetry-collector chart.
# Receives all telemetry and forwards to SigNoz.
#
# This collector handles:
#  - Scraping infra metrics (kubelet, cAdvisor, KSM, node-exporter)
#  - Collecting pod logs via filelog receiver
#  - Filtering out noisy/useless metrics to reduce storage
#  - Forwarding cleaned data to SigNoz OTel Collector
#
# Runs as DaemonSet to access node-level log files.
# ============================================================
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.119.0

mode: daemonset

# Expose the collector as a service so apps can send OTLP to it
service:
  enabled: true

# Mount host log directories for filelog receiver
extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlogcontainers
    hostPath:
      path: /var/log/containers

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlogcontainers
    mountPath: /var/log/containers
    readOnly: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    prometheus:
      config:
        scrape_configs:
          - job_name: 'kubernetes-nodes'
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics

          - job_name: 'kubernetes-cadvisor'
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor

          - job_name: 'kube-state-metrics'
            static_configs:
              - targets: ['dev-monitoring-ksm-kube-state-metrics.monitoring.svc.cluster.local:8080']

          - job_name: 'node-exporter'
            static_configs:
              - targets: ['dev-monitoring-node-exporter-prometheus-node-exporter.monitoring.svc.cluster.local:9100']

    # ── Pod log collection ──────────────────────────────────
    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        # Skip collector's own logs to avoid feedback loop
        - /var/log/pods/monitoring_dev-monitoring-otel-*/**/*.log
        # Skip SigNoz internal components
        - /var/log/pods/monitoring_dev-monitoring-signoz-*/**/*.log
        - /var/log/pods/monitoring_chi-*/**/*.log
        - /var/log/pods/monitoring_signoz-*/**/*.log
      start_at: end
      include_file_path: true
      include_file_name: false
      operators:
        # Parse CRI log format
        - type: router
          id: get-format
          routes:
            - output: parser-containerd
              expr: 'body matches "^[^ Z]+ "'
            - output: parser-docker
              expr: 'body matches "^\\{"'
          default: parser-containerd

        - type: regex_parser
          id: parser-containerd
          regex: '^(?P<time>[^ Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
          timestamp:
            parse_from: attributes.time
            layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          output: extract-metadata

        - type: json_parser
          id: parser-docker
          output: extract-metadata
          timestamp:
            parse_from: attributes.time
            layout: '%Y-%m-%dT%H:%M:%S.%LZ'

        - type: regex_parser
          id: extract-metadata
          regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/.*$'
          parse_from: attributes["log.file.path"]

        - type: move
          from: attributes.log
          to: body

        - type: move
          from: attributes.stream
          to: attributes["log.iostream"]

        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]

        - type: move
          from: attributes.pod_name
          to: resource["k8s.pod.name"]

        - type: move
          from: attributes.container_name
          to: resource["k8s.container.name"]

        - type: move
          from: attributes.uid
          to: resource["k8s.pod.uid"]

        # Clean up parsed attributes
        - type: remove
          field: attributes.time
        - type: remove
          field: attributes.logtag

  processors:
    batch:
      send_batch_size: 10000
      timeout: 2s

    # ── Set service.name for scraped infra metrics ──────────
    # Without this, Prometheus metrics inherit pod names as service.name,
    # creating duplicate entries in OneUptime alongside app-sent telemetry.
    resource/infra-metrics:
      attributes:
        - key: service.name
          value: "infra-metrics"
          action: upsert
        - key: service.namespace
          value: "monitoring"
          action: upsert

    # ── Enrich logs with k8s metadata ───────────────────────
    k8sattributes:
      auth_type: "serviceAccount"
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.node.name
          - k8s.container.name
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid

    # ── Filter logs: drop noisy namespaces ──────────────────
    filter/logs:
      error_mode: ignore
      logs:
        log_record:
          # Drop kube-system noise (coredns, traefik, metrics-server, etc.)
          - 'resource.attributes["k8s.namespace.name"] == "kube-system"'
          # Drop argocd logs (very chatty)
          - 'resource.attributes["k8s.namespace.name"] == "argocd"'

    # ── Drop noisy / low-value metrics ──────────────────────
    filter/metrics:
      error_mode: ignore
      metrics:
        metric:
          # --- kubelet / apiserver noise ---
          - 'name == "apiserver_request_duration_seconds"'
          - 'name == "apiserver_request_total"'
          - 'name == "apiserver_storage_objects"'
          - 'name == "etcd_request_duration_seconds"'
          - 'name == "rest_client_request_duration_seconds"'
          - 'name == "rest_client_requests_total"'
          - 'name == "workqueue_depth"'
          - 'name == "workqueue_adds_total"'
          - 'name == "workqueue_queue_duration_seconds"'
          - 'name == "workqueue_work_duration_seconds"'
          - 'IsMatch(name, "apiserver_admission_.*")'
          - 'IsMatch(name, "apiserver_audit_.*")'
          - 'IsMatch(name, "apiserver_cel_.*")'
          - 'IsMatch(name, "apiserver_watch_.*")'
          - 'IsMatch(name, "etcd_.*")'
          - 'IsMatch(name, "field_validation_.*")'
          - 'IsMatch(name, "authentication_.*")'
          - 'IsMatch(name, "authorization_.*")'
          # --- Go runtime noise ---
          - 'IsMatch(name, "go_gc_.*")'
          - 'IsMatch(name, "go_sched_.*")'
          - 'IsMatch(name, "go_cpu_.*")'
          - 'name == "go_threads"'
          - 'name == "go_info"'
          # --- process metrics ---
          - 'IsMatch(name, "process_.*")'
          # --- cAdvisor noise ---
          - 'IsMatch(name, "container_blkio_.*")'
          - 'IsMatch(name, "container_tasks_.*")'
          - 'name == "container_sockets"'
          - 'name == "container_threads"'
          - 'name == "container_threads_max"'
          - 'name == "container_ulimits_soft"'
          - 'name == "container_file_descriptors"'
          - 'name == "container_last_seen"'
          - 'name == "container_start_time_seconds"'
          - 'IsMatch(name, "machine_.*")'
          # --- KSM noise ---
          - 'IsMatch(name, "kube_pod_labels")'
          - 'IsMatch(name, "kube_pod_annotations")'
          - 'IsMatch(name, "kube_pod_owner")'
          - 'IsMatch(name, "kube_.*_annotations")'
          - 'IsMatch(name, "kube_.*_labels")'
          - 'IsMatch(name, "kube_.*_created")'
          - 'IsMatch(name, "kube_lease_.*")'
          - 'IsMatch(name, "kube_certificatesigningrequest_.*")'
          - 'IsMatch(name, "kube_configmap_.*")'
          - 'IsMatch(name, "kube_secret_.*")'
          - 'IsMatch(name, "kube_endpoint_.*")'
          - 'IsMatch(name, "kube_service_.*")'
          - 'IsMatch(name, "kube_networkpolicy_.*")'
          - 'IsMatch(name, "kube_poddisruptionbudget_.*")'
          - 'IsMatch(name, "kube_replicaset_.*")'
          - 'IsMatch(name, "kube_horizontalpodautoscaler_.*")'
          - 'IsMatch(name, "kube_clusterrole.*")'
          - 'IsMatch(name, "kube_role_.*")'
          - 'IsMatch(name, "kube_limitrange_.*")'
          - 'IsMatch(name, "kube_resourcequota_.*")'
          - 'IsMatch(name, "kube_storageclass_.*")'
          - 'IsMatch(name, "kube_mutatingwebhookconfiguration_.*")'
          - 'IsMatch(name, "kube_validatingwebhookconfiguration_.*")'
          # --- node-exporter noise ---
          - 'IsMatch(name, "node_arp_.*")'
          - 'IsMatch(name, "node_bonding_.*")'
          - 'IsMatch(name, "node_boot_time_seconds")'
          - 'IsMatch(name, "node_context_switches_total")'
          - 'IsMatch(name, "node_cooling_.*")'
          - 'IsMatch(name, "node_dmi_.*")'
          - 'IsMatch(name, "node_entropy_.*")'
          - 'IsMatch(name, "node_filefd_.*")'
          - 'IsMatch(name, "node_forks_total")'
          - 'IsMatch(name, "node_hwmon_.*")'
          - 'IsMatch(name, "node_intr_total")'
          - 'IsMatch(name, "node_ipvs_.*")'
          - 'IsMatch(name, "node_nf_.*")'
          - 'IsMatch(name, "node_netstat_.*")'
          - 'IsMatch(name, "node_nfs.*")'
          - 'IsMatch(name, "node_os_.*")'
          - 'IsMatch(name, "node_power_.*")'
          - 'IsMatch(name, "node_pressure_.*")'
          - 'IsMatch(name, "node_procs_.*")'
          - 'IsMatch(name, "node_schedstat_.*")'
          - 'IsMatch(name, "node_scrape_.*")'
          - 'IsMatch(name, "node_sockstat_.*")'
          - 'IsMatch(name, "node_softnet_.*")'
          - 'IsMatch(name, "node_textfile_.*")'
          - 'IsMatch(name, "node_thermal_.*")'
          - 'IsMatch(name, "node_time_.*")'
          - 'IsMatch(name, "node_timex_.*")'
          - 'IsMatch(name, "node_udp_.*")'
          - 'IsMatch(name, "node_uname_info")'
          - 'IsMatch(name, "node_vmstat_.*")'
          - 'IsMatch(name, "node_xfs_.*")'
          - 'IsMatch(name, "node_zfs_.*")'
          # --- scrape meta ---
          - 'name == "scrape_duration_seconds"'
          - 'name == "scrape_samples_scraped"'
          - 'name == "scrape_samples_post_metric_relabeling"'
          - 'name == "scrape_series_added"'
          - 'name == "up"'

    # ── Remove high-cardinality labels ──────────────────────
    transform/drop_labels:
      metric_statements:
        - context: datapoint
          statements:
            - delete_key(attributes, "id")
            - delete_key(attributes, "image")
            - delete_key(attributes, "uid")
            - delete_key(attributes, "instance")
            - delete_key(attributes, "prometheus_replica")

  exporters:
    # Send to OneUptime OTLP endpoint (app service exposes gRPC on 4317)
    otlp/oneuptime:
      endpoint: "dev-monitoring-oneuptime-app.monitoring.svc.cluster.local:4317"
      headers:
        x-oneuptime-token: "7eeabbb6-5395-4c64-8a30-2330d0e56f59"
      tls:
        insecure: true

  service:
    pipelines:
      # Infra metrics from Prometheus scrapes (kubelet, cAdvisor, KSM, node-exporter)
      metrics/infra:
        receivers: [prometheus]
        processors: [resource/infra-metrics, filter/metrics, transform/drop_labels, batch]
        exporters: [otlp/oneuptime]
      # App metrics from OTLP (backend-server, etc.) — keep original service.name
      metrics/app:
        receivers: [otlp]
        processors: [filter/metrics, transform/drop_labels, batch]
        exporters: [otlp/oneuptime]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/oneuptime]
      logs:
        receivers: [otlp, filelog]
        processors: [k8sattributes, filter/logs, batch]
        exporters: [otlp/oneuptime]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions", "networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
