# ============================================================
# OpenTelemetry Collector (Local Dev)
# ============================================================
# Uses the open-telemetry/opentelemetry-collector chart.
# Receives OTLP telemetry from apps, scrapes infra metrics,
# and collects pod logs from all namespaces.
# ============================================================
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.119.0

# DaemonSet mode required for filelog receiver (reads host log files)
mode: daemonset

# Expose the collector as a service so apps can send OTLP to it
service:
  enabled: true

# ── Security hardening ──
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  automountServiceAccountToken: true

# ── Host log mounts (required for filelog receiver) ──
extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlogcontainers
    hostPath:
      path: /var/log/containers

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlogcontainers
    mountPath: /var/log/containers
    readOnly: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # ── Collector self-metrics ──
    prometheus/self:
      config:
        scrape_configs:
          - job_name: 'otel-collector-self'
            scrape_interval: 30s
            static_configs:
              - targets: ['localhost:8888']

    # ── cAdvisor (OOM kills + CPU throttling + memory/cpu usage) ──
    prometheus/cadvisor:
      config:
        scrape_configs:
          - job_name: 'kubernetes-cadvisor'
            scheme: https
            scrape_interval: 30s
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor

    # ── Kubelet metrics (node-level resource usage) ──
    prometheus/kubelet:
      config:
        scrape_configs:
          - job_name: 'kubernetes-nodes'
            scheme: https
            scrape_interval: 30s
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics

    # ── Node Exporter (hardware/OS metrics — disk, network, CPU) ──
    prometheus/node-exporter:
      config:
        scrape_configs:
          - job_name: 'node-exporter'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-node-exporter-prometheus-node-exporter.monitoring.svc.cluster.local:9100']

    # ── KSM (resource requests/limits to compare against actual usage) ──
    prometheus/ksm:
      config:
        scrape_configs:
          - job_name: 'kube-state-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-ksm-kube-state-metrics.monitoring.svc.cluster.local:8080']

    # ── Blackbox Exporter probes (uptime checks) ──
    prometheus/blackbox:
      config:
        scrape_configs:
          - job_name: 'blackbox-argocd'
            scrape_interval: 30s
            metrics_path: /probe
            params:
              module: [http_2xx]
            static_configs:
              - targets:
                  - http://argocd-server.argocd.svc.cluster.local:80
                labels:
                  namespace: argocd
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: dev-monitoring-blackbox-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

    # ── CoreDNS metrics (DNS request rates, latency, errors, cache) ──
    prometheus/coredns:
      config:
        scrape_configs:
          - job_name: 'coredns'
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: ['kube-system']
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: kube-dns
              - source_labels: [__meta_kubernetes_endpoint_port_name]
                action: keep
                regex: metrics

    # ── LGTM Stack self-monitoring (Loki, Tempo, Prometheus, Grafana) ──
    prometheus/loki:
      config:
        scrape_configs:
          - job_name: 'loki'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-lgtm-loki.monitoring.svc.cluster.local:3100']
                labels:
                  namespace: monitoring

    prometheus/tempo:
      config:
        scrape_configs:
          - job_name: 'tempo'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-lgtm-tempo.monitoring.svc.cluster.local:3200']
                labels:
                  namespace: monitoring

    prometheus/prometheus:
      config:
        scrape_configs:
          - job_name: 'prometheus'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-lgtm-prometheus-server.monitoring.svc.cluster.local:80']
                labels:
                  namespace: monitoring

    prometheus/grafana:
      config:
        scrape_configs:
          - job_name: 'grafana'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-lgtm-grafana.monitoring.svc.cluster.local:80']
                labels:
                  namespace: monitoring

    prometheus/pyroscope:
      config:
        scrape_configs:
          - job_name: 'pyroscope'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-pyroscope.monitoring.svc.cluster.local:4040']
                labels:
                  namespace: monitoring

    # ── ArgoCD metrics (sync status, app health, reconciliation) ──
    prometheus/argocd:
      config:
        scrape_configs:
          - job_name: 'argocd-server-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['argocd-server-metrics.argocd.svc.cluster.local:8083']
                labels:
                  namespace: argocd
          - job_name: 'argocd-repo-server-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['argocd-repo-server-metrics.argocd.svc.cluster.local:8084']
                labels:
                  namespace: argocd
          - job_name: 'argocd-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['argocd-application-controller-metrics.argocd.svc.cluster.local:8082']
                labels:
                  namespace: argocd

    # ── Pod log collection (all namespaces) ──
    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        # Don't collect our own logs (feedback loop)
        - /var/log/pods/monitoring_dev-monitoring-otel-*/**/*.log
      start_at: end
      include_file_path: true
      include_file_name: false
      operators:
        - type: router
          id: get-format
          routes:
            - output: parser-containerd
              expr: 'body matches "^[^ Z]+ "'
            - output: parser-docker
              expr: 'body matches "^\\{"'
          default: parser-containerd

        - type: regex_parser
          id: parser-containerd
          regex: '^(?P<time>[^ Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)'
          timestamp:
            parse_from: attributes.time
            layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          output: extract-metadata

        - type: json_parser
          id: parser-docker
          output: extract-metadata
          timestamp:
            parse_from: attributes.time
            layout: '%Y-%m-%dT%H:%M:%S.%LZ'

        - type: regex_parser
          id: extract-metadata
          regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/.*'
          parse_from: attributes["log.file.path"]

        - type: move
          from: attributes.log
          to: body

        - type: move
          from: attributes.stream
          to: attributes["log.iostream"]

        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]

        - type: move
          from: attributes.pod_name
          to: resource["k8s.pod.name"]

        - type: move
          from: attributes.container_name
          to: resource["k8s.container.name"]

        - type: move
          from: attributes.uid
          to: resource["k8s.pod.uid"]

        - type: remove
          field: attributes.time
        - type: remove
          field: attributes.logtag

  processors:
    batch:
      send_batch_size: 10000
      timeout: 2s

    # ── Set service.name for scraped metrics ──
    resource/self:
      attributes:
        - key: service.name
          value: "otel-collector"
          action: upsert

    resource/cadvisor:
      attributes:
        - key: service.name
          value: "kubernetes-cadvisor"
          action: upsert

    resource/kubelet:
      attributes:
        - key: service.name
          value: "kubelet"
          action: upsert

    resource/node-exporter:
      attributes:
        - key: service.name
          value: "node-exporter"
          action: upsert

    resource/ksm:
      attributes:
        - key: service.name
          value: "kube-state-metrics"
          action: upsert

    resource/coredns:
      attributes:
        - key: service.name
          value: "coredns"
          action: upsert

    # ── Enrich logs with k8s metadata (pod, deployment, namespace) ──
    k8sattributes:
      auth_type: "serviceAccount"
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.node.name
          - k8s.container.name
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid

    # ── Filter logs: drop noisy namespaces ──
    filter/logs:
      error_mode: ignore
      logs:
        log_record:
          - 'resource.attributes["k8s.namespace.name"] == "kube-system"'

    # ── Drop noisy / low-value metrics (for app OTLP metrics) ──
    filter/metrics:
      error_mode: ignore
      metrics:
        metric:
          # --- Go runtime noise from app instrumentation ---
          - 'IsMatch(name, "go_gc_.*")'
          - 'IsMatch(name, "go_sched_.*")'
          - 'IsMatch(name, "go_cpu_.*")'
          - 'name == "go_threads"'
          - 'name == "go_info"'
          # --- process metrics ---
          - 'IsMatch(name, "process_.*")'
          # --- scrape meta ---
          - 'name == "scrape_duration_seconds"'
          - 'name == "scrape_samples_scraped"'
          - 'name == "scrape_samples_post_metric_relabeling"'
          - 'name == "scrape_series_added"'
          - 'name == "up"'

    # ── Keep only useful cAdvisor + KSM metrics (allowlist approach) ──
    filter/infra-allow:
      error_mode: ignore
      metrics:
        metric:
          - 'not(IsMatch(name, "container_cpu_usage_seconds_total") or IsMatch(name, "container_memory_usage_bytes") or IsMatch(name, "container_memory_working_set_bytes") or IsMatch(name, "container_oom_events_total") or IsMatch(name, "container_cpu_cfs_throttled_periods_total") or IsMatch(name, "container_cpu_cfs_periods_total") or IsMatch(name, "kube_pod_container_resource_requests") or IsMatch(name, "kube_pod_container_resource_limits") or IsMatch(name, "kube_pod_container_status_restarts_total") or IsMatch(name, "kube_pod_container_status_last_terminated_reason") or IsMatch(name, "kube_pod_status_phase") or IsMatch(name, "kube_container_status_waiting_reason") or IsMatch(name, "kube_pod_info") or IsMatch(name, "kube_node_status_allocatable") or IsMatch(name, "kube_node_status_capacity") or IsMatch(name, "kube_node_info") or IsMatch(name, "kube_namespace_status_phase") or IsMatch(name, "kube_deployment_status_replicas") or IsMatch(name, "kube_deployment_spec_replicas") or IsMatch(name, "kube_statefulset_status_replicas") or IsMatch(name, "kube_statefulset_replicas") or IsMatch(name, "kube_daemonset_status.*") or IsMatch(name, "scrape_.*") or name == "up")'
          - 'name == "scrape_duration_seconds"'
          - 'name == "scrape_samples_scraped"'
          - 'name == "scrape_samples_post_metric_relabeling"'
          - 'name == "scrape_series_added"'
          - 'name == "up"'

  exporters:
    # Send traces to Tempo (OTLP gRPC)
    otlp/tempo:
      endpoint: "dev-lgtm-tempo.monitoring.svc.cluster.local:4317"
      tls:
        insecure: true
    # Send logs to Loki (OTLP HTTP — Loki's native OTLP endpoint)
    otlphttp/loki:
      endpoint: "http://dev-lgtm-loki.monitoring.svc.cluster.local:3100/otlp"
    # Send metrics to Prometheus via remote write
    prometheusremotewrite:
      endpoint: "http://dev-lgtm-prometheus-server.monitoring.svc.cluster.local:80/api/v1/write"

  service:
    telemetry:
      metrics:
        address: 0.0.0.0:8888
        level: normal

    pipelines:
      # Collector self-metrics
      metrics/self:
        receivers: [prometheus/self]
        processors: [resource/self, batch]
        exporters: [prometheusremotewrite]
      # cAdvisor metrics (OOM, CPU throttle, memory/cpu usage)
      metrics/cadvisor:
        receivers: [prometheus/cadvisor]
        processors: [resource/cadvisor, filter/infra-allow, batch]
        exporters: [prometheusremotewrite]
      # Kubelet metrics (node-level)
      metrics/kubelet:
        receivers: [prometheus/kubelet]
        processors: [resource/kubelet, batch]
        exporters: [prometheusremotewrite]
      # Node Exporter metrics (hardware/OS)
      metrics/node-exporter:
        receivers: [prometheus/node-exporter]
        processors: [resource/node-exporter, batch]
        exporters: [prometheusremotewrite]
      # KSM metrics (resource requests/limits, pod status)
      metrics/ksm:
        receivers: [prometheus/ksm]
        processors: [resource/ksm, filter/infra-allow, batch]
        exporters: [prometheusremotewrite]
      # ArgoCD metrics
      metrics/argocd:
        receivers: [prometheus/argocd]
        processors: [batch]
        exporters: [prometheusremotewrite]
      # LGTM stack self-monitoring
      metrics/loki:
        receivers: [prometheus/loki]
        processors: [batch]
        exporters: [prometheusremotewrite]
      metrics/tempo:
        receivers: [prometheus/tempo]
        processors: [batch]
        exporters: [prometheusremotewrite]
      metrics/prometheus:
        receivers: [prometheus/prometheus]
        processors: [batch]
        exporters: [prometheusremotewrite]
      metrics/grafana:
        receivers: [prometheus/grafana]
        processors: [batch]
        exporters: [prometheusremotewrite]
      metrics/pyroscope:
        receivers: [prometheus/pyroscope]
        processors: [batch]
        exporters: [prometheusremotewrite]
      # CoreDNS metrics
      metrics/coredns:
        receivers: [prometheus/coredns]
        processors: [resource/coredns, batch]
        exporters: [prometheusremotewrite]
      # Blackbox probes (uptime checks)
      metrics/blackbox:
        receivers: [prometheus/blackbox]
        processors: [batch]
        exporters: [prometheusremotewrite]
      # App metrics from OTLP (backend-server, etc.)
      metrics:
        receivers: [otlp]
        processors: [filter/metrics, batch]
        exporters: [prometheusremotewrite]
      # Traces
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo]
      # Logs from OTLP (app instrumentation)
      logs:
        receivers: [otlp]
        processors: [k8sattributes, batch]
        exporters: [otlphttp/loki]
      # Logs from pod files (all system pods)
      logs/filelog:
        receivers: [filelog]
        processors: [k8sattributes, filter/logs, batch]
        exporters: [otlphttp/loki]

# Expected usage with all features: ~50m CPU, ~350Mi memory
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
      verbs: ["get", "list", "watch"]
    # Required for k8sattributes processor
    - apiGroups: ["apps"]
      resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions", "networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
