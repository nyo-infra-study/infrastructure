# ============================================================
# Receivers — Infrastructure Metrics
# ============================================================
# Prometheus scrape receivers for cluster-level infra:
# cAdvisor, kubelet, node-exporter, KSM, CoreDNS, collector self.
# ============================================================
config:
  receivers:
    # ── Collector self-metrics ──
    prometheus/self:
      config:
        scrape_configs:
          - job_name: 'otel-collector-self'
            scrape_interval: 30s
            static_configs:
              - targets: ['localhost:8888']

    # ── cAdvisor (OOM kills + CPU throttling + memory/cpu usage) ──
    prometheus/cadvisor:
      config:
        scrape_configs:
          - job_name: 'kubernetes-cadvisor'
            scheme: https
            scrape_interval: 30s
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
            # Drop at scrape time — only keep what dashboards actually use
            metric_relabel_configs:
              # Allowlist: keep only these metrics
              - source_labels: [__name__]
                regex: '(container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_oom_events_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total)'
                action: keep
              # Drop pause/sandbox containers (empty container label)
              - source_labels: [container]
                regex: '^$'
                action: drop
              # Drop kube-system namespace (noisy, not actionable)
              - source_labels: [namespace]
                regex: 'kube-system'
                action: drop

    # ── Kubelet metrics (node-level resource usage) ──
    prometheus/kubelet:
      config:
        scrape_configs:
          - job_name: 'kubernetes-nodes'
            scheme: https
            scrape_interval: 30s
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - action: labelmap
                regex: __meta_kubernetes_node_label_(.+)
              - target_label: __address__
                replacement: kubernetes.default.svc:443
              - source_labels: [__meta_kubernetes_node_name]
                regex: (.+)
                target_label: __metrics_path__
                replacement: /api/v1/nodes/$${1}/proxy/metrics
            # Drop at scrape time — keep only useful kubelet metrics
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(kubelet_running_pods|kubelet_running_containers|kubelet_node_name|kubelet_volume_stats_available_bytes|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_used_bytes|kubelet_pod_start_duration_seconds_count|kubelet_pod_start_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_count|volume_manager_total_volumes)'
                action: keep

    # ── Node Exporter (hardware/OS metrics — disk, network, CPU) ──
    prometheus/node-exporter:
      config:
        scrape_configs:
          - job_name: 'node-exporter'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-node-exporter-prometheus-node-exporter.monitoring.svc.cluster.local:9100']
            # Drop at scrape time — keep only CPU/memory/disk/network essentials
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(node_cpu_seconds_total|node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_MemFree_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_filesystem_files|node_filesystem_files_free|node_disk_read_bytes_total|node_disk_written_bytes_total|node_disk_io_time_seconds_total|node_network_receive_bytes_total|node_network_transmit_bytes_total|node_network_receive_errs_total|node_network_transmit_errs_total|node_load1|node_load5|node_load15|node_uname_info|node_boot_time_seconds)'
                action: keep

    # ── KSM (resource requests/limits to compare against actual usage) ──
    prometheus/ksm:
      config:
        scrape_configs:
          - job_name: 'kube-state-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-ksm-kube-state-metrics.monitoring.svc.cluster.local:8080']
            # Drop at scrape time — only keep metrics used by dashboards
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(kube_pod_info|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_pod_status_phase|kube_container_status_waiting_reason|kube_node_status_allocatable|kube_node_status_capacity|kube_namespace_status_phase|kube_deployment_status_replicas|kube_deployment_spec_replicas|kube_statefulset_status_replicas|kube_statefulset_replicas|kube_daemonset_status_number_ready|kube_daemonset_status_desired_number_scheduled)'
                action: keep

    # ── CoreDNS metrics (DNS request rates, latency, errors, cache) ──
    prometheus/coredns:
      config:
        scrape_configs:
          - job_name: 'coredns'
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: ['kube-system']
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: kube-dns
              - source_labels: [__meta_kubernetes_endpoint_port_name]
                action: keep
                regex: metrics

    # ── Traefik metrics (request rates, latency, errors, TLS, entrypoints) ──
    prometheus/traefik:
      config:
        scrape_configs:
          - job_name: 'traefik'
            scrape_interval: 15s
            static_configs:
              - targets: ['traefik.traefik.svc.cluster.local:9100']
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(traefik_entrypoint_requests_total|traefik_entrypoint_request_duration_seconds_bucket|traefik_entrypoint_request_duration_seconds_count|traefik_entrypoint_request_duration_seconds_sum|traefik_entrypoint_open_connections|traefik_service_requests_total|traefik_service_request_duration_seconds_bucket|traefik_service_request_duration_seconds_count|traefik_service_request_duration_seconds_sum|traefik_service_open_connections|traefik_service_retries_total|traefik_router_requests_total|traefik_router_request_duration_seconds_bucket|traefik_router_request_duration_seconds_count|traefik_router_request_duration_seconds_sum|traefik_tls_certs_not_after)'
                action: keep
