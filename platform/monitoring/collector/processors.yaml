# ============================================================
# Processors
# ============================================================
# Batch, memory limiter, k8s enrichment, metric filters,
# and resource attribute processors for service.name tagging.
# ============================================================
config:
  processors:
    batch:
      send_batch_size: 1024
      timeout: 2s

    # ── Memory limiter — prevents OOM by applying backpressure ──
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100

    # ── Set service.name for scraped metrics ──
    resource/self:
      attributes:
        - key: service.name
          value: "otel-collector"
          action: upsert

    resource/cadvisor:
      attributes:
        - key: service.name
          value: "kubernetes-cadvisor"
          action: upsert

    resource/kubelet:
      attributes:
        - key: service.name
          value: "kubelet"
          action: upsert

    resource/node-exporter:
      attributes:
        - key: service.name
          value: "node-exporter"
          action: upsert

    resource/ksm:
      attributes:
        - key: service.name
          value: "kube-state-metrics"
          action: upsert

    resource/coredns:
      attributes:
        - key: service.name
          value: "coredns"
          action: upsert

    resource/argocd:
      attributes:
        - key: service.name
          value: "argocd"
          action: upsert

    resource/clickhouse:
      attributes:
        - key: service.name
          value: "clickhouse"
          action: upsert

    resource/blackbox:
      attributes:
        - key: service.name
          value: "blackbox-exporter"
          action: upsert

    # ── Default compliance scope for infrastructure metrics ──
    # Default to PCI (confidential) — services must explicitly opt out
    resource/infra-scope:
      attributes:
        - key: compliance.scope
          value: "pci"
          action: insert

    # ── Default compliance scope for system pod logs (filelog) ──
    # System logs are non-PCI by default. Apps that need PCI scoping
    # set it via OTEL_RESOURCE_ATTRIBUTES in their SDK telemetry.
    resource/logs-scope:
      attributes:
        - key: compliance.scope
          value: "non-pci"
          action: insert
        - key: service.name
          from_attribute: k8s.pod.name
          action: insert

    # ── Enrich telemetry with k8s metadata (pod, deployment, namespace) ──
    # Applied to all app OTLP pipelines (metrics, traces, logs) and filelog
    k8sattributes:
      auth_type: "serviceAccount"
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.node.name
          - k8s.container.name
        annotations:
          - tag_name: service.version
            key: resource.opentelemetry.io/service.version
            from: pod
          - tag_name: deployment.environment
            key: resource.opentelemetry.io/deployment.environment
            from: pod
        labels:
          - tag_name: app.kubernetes.io/name
            key: app.kubernetes.io/name
            from: pod
          - tag_name: app.kubernetes.io/version
            key: app.kubernetes.io/version
            from: pod
          - tag_name: app.kubernetes.io/component
            key: app.kubernetes.io/component
            from: pod
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: connection

    # ── Enforce required resource attributes on app telemetry ──
    # Fills in missing attributes as defaults — does NOT overwrite SDK/annotation values
    # Default to PCI (confidential) — services explicitly set non-pci to opt out
    resource/app-enforce:
      attributes:
        - key: deployment.environment
          value: "dev"
          action: insert
        - key: service.namespace
          value: "dev"
          action: insert
        - key: compliance.scope
          value: "pci"
          action: insert

    # ── Filter logs: drop noisy namespaces ──
    filter/logs:
      error_mode: ignore
      logs:
        log_record:
          - 'resource.attributes["k8s.namespace.name"] == "kube-system"'

    # ── Filter traces: drop health check spans and Traefik platform noise ──
    filter/traces:
      error_mode: ignore
      traces:
        span:
          - 'IsMatch(attributes["http.route"], ".*/health.*")'
          - 'IsMatch(attributes["http.route"], ".*/readyz.*")'
          - 'IsMatch(attributes["http.route"], ".*/livez.*")'
          - 'IsMatch(attributes["http.target"], ".*/health.*")'
          - 'IsMatch(attributes["http.target"], ".*/readyz.*")'
          - 'IsMatch(attributes["http.target"], ".*/livez.*")'
          - 'IsMatch(attributes["url.path"], ".*/health.*")'
          - 'IsMatch(attributes["url.path"], ".*/readyz.*")'
          - 'IsMatch(attributes["url.path"], ".*/livez.*")'
          - 'IsMatch(name, ".*health.*")'
          - 'IsMatch(name, ".*readyz.*")'
          - 'IsMatch(name, ".*livez.*")'
          - 'IsMatch(attributes["url.path"], "/ping")'

    # ── Enrich Traefik span names with the target host ──
    # Kept for reference but not used in pipeline (sampleRate: 0 handles noise)
    # transform/traefik-service-name: ...

    # ── Drop noisy / low-value metrics (for app OTLP metrics) ──
    filter/metrics:
      error_mode: ignore
      metrics:
        metric:
          # --- Go runtime noise from app instrumentation ---
          - 'IsMatch(name, "go_gc_.*")'
          - 'IsMatch(name, "go_sched_.*")'
          - 'IsMatch(name, "go_cpu_.*")'
          - 'name == "go_threads"'
          - 'name == "go_info"'
          # --- process metrics ---
          - 'IsMatch(name, "process_.*")'
          # --- scrape meta ---
          - 'name == "scrape_duration_seconds"'
          - 'name == "scrape_samples_scraped"'
          - 'name == "scrape_samples_post_metric_relabeling"'
          - 'name == "scrape_series_added"'
          - 'name == "up"'

    # ── Keep only useful cAdvisor + KSM metrics (safety net — primary filtering at scrape) ──
    filter/infra-allow:
      error_mode: ignore
      metrics:
        datapoint:
          # Drop any remaining empty-container cAdvisor metrics that slip through
          - 'IsMatch(metric.name, "container_.*") and resource.attributes["container"] == ""'

    # ── Kubelet filter (safety net — primary filtering at scrape) ──
    filter/kubelet:
      error_mode: ignore
      metrics:
        metric:
          - 'IsMatch(name, "go_.*")'
          - 'IsMatch(name, "process_.*")'

    # ── ArgoCD filter (no-op — all filtering done at scrape level) ──
    filter/argocd:
      error_mode: ignore
      metrics:
        metric: []
