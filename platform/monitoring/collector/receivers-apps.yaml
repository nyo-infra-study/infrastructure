# ============================================================
# Receivers — App OTLP + ArgoCD Self-Monitoring
# ============================================================
# OTLP receiver for application telemetry (traces, metrics, logs)
# plus Prometheus scrapers for ArgoCD self-metrics.
# ============================================================
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # ── ClickHouse metrics ──
    prometheus/clickhouse:
      config:
        scrape_configs:
          - job_name: 'clickhouse'
            scrape_interval: 30s
            static_configs:
              - targets: ['{{ .Values.global.endpoints.clickhouse.host }}:9363']
                labels:
                  namespace: monitoring
            # Drop at scrape time — keep only query/insert/memory/replication essentials
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(ClickHouseMetrics_Query|ClickHouseMetrics_Merge|ClickHouseMetrics_MemoryTracking|ClickHouseMetrics_ReplicatedSend|ClickHouseMetrics_ReplicatedFetch|ClickHouseProfileEvents_InsertedRows|ClickHouseProfileEvents_InsertedBytes|ClickHouseProfileEvents_SelectedRows|ClickHouseProfileEvents_SelectedBytes|ClickHouseProfileEvents_FailedQuery|ClickHouseProfileEvents_QueryTimeMicroseconds|ClickHouseProfileEvents_MergedRows|ClickHouseProfileEvents_MergedUncompressedBytes|ClickHouseAsyncMetrics_MaxPartCountForPartition|ClickHouseAsyncMetrics_TotalRowsOfMergeTreeTables|ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables|ClickHouseMetrics_TCPConnection|ClickHouseMetrics_HTTPConnection)'
                action: keep

    # ── Gigapipe self-metrics ──
    prometheus/gigapipe:
      config:
        scrape_configs:
          - job_name: 'gigapipe-writer'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100']
                labels:
                  namespace: monitoring
          - job_name: 'gigapipe-reader-pci'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100']
                labels:
                  namespace: monitoring
          - job_name: 'gigapipe-reader-nonpci'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-gigapipe-reader-nonpci.monitoring.svc.cluster.local:3100']
                labels:
                  namespace: monitoring

    # ── ArgoCD metrics (sync status, app health, reconciliation) ──
    prometheus/argocd:
      config:
        scrape_configs:
          - job_name: 'argocd-server-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['argocd-server-metrics.argocd.svc.cluster.local:8083']
                labels:
                  namespace: argocd
            # Keep only metrics used by the ArgoCD Grafana dashboard
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(argocd_app_info|argocd_app_sync_total|argocd_app_reconcile_count|argocd_app_reconcile_bucket|argocd_app_k8s_request_total|argocd_kubectl_exec_pending|argocd_cluster_info|argocd_cluster_api_resource_objects|argocd_cluster_api_resources|argocd_cluster_events_total|argocd_git_request_total|argocd_git_request_duration_seconds_bucket|argocd_redis_request_total|grpc_server_handled_total|workqueue_depth|process_start_time_seconds|process_cpu_seconds_total|go_goroutines|go_memstats_heap_alloc_bytes|go_gc_duration_seconds)'
                action: keep
          - job_name: 'argocd-repo-server-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['argocd-repo-server-metrics.argocd.svc.cluster.local:8084']
                labels:
                  namespace: argocd
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(argocd_app_info|argocd_app_sync_total|argocd_app_reconcile_count|argocd_app_reconcile_bucket|argocd_app_k8s_request_total|argocd_kubectl_exec_pending|argocd_cluster_info|argocd_cluster_api_resource_objects|argocd_cluster_api_resources|argocd_cluster_events_total|argocd_git_request_total|argocd_git_request_duration_seconds_bucket|argocd_redis_request_total|grpc_server_handled_total|workqueue_depth|process_start_time_seconds|process_cpu_seconds_total|go_goroutines|go_memstats_heap_alloc_bytes|go_gc_duration_seconds)'
                action: keep
          - job_name: 'argocd-metrics'
            scrape_interval: 30s
            static_configs:
              - targets: ['argocd-application-controller-metrics.argocd.svc.cluster.local:8082']
                labels:
                  namespace: argocd
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(argocd_app_info|argocd_app_sync_total|argocd_app_reconcile_count|argocd_app_reconcile_bucket|argocd_app_k8s_request_total|argocd_kubectl_exec_pending|argocd_cluster_info|argocd_cluster_api_resource_objects|argocd_cluster_api_resources|argocd_cluster_events_total|argocd_git_request_total|argocd_git_request_duration_seconds_bucket|argocd_redis_request_total|grpc_server_handled_total|workqueue_depth|process_start_time_seconds|process_cpu_seconds_total|go_goroutines|go_memstats_heap_alloc_bytes|go_gc_duration_seconds)'
                action: keep
