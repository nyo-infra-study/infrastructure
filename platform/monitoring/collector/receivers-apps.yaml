# ============================================================
# Receivers — App OTLP + ArgoCD Self-Monitoring
# ============================================================
# OTLP receiver for application telemetry (traces, metrics, logs)
# plus Prometheus scrapers for ArgoCD self-metrics.
# ============================================================
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # ── ClickHouse metrics ──
    prometheus/clickhouse:
      config:
        scrape_configs:
          - job_name: 'clickhouse'
            scrape_interval: 30s
            static_configs:
              - targets: ['{{ .Values.global.endpoints.clickhouse.host }}:9363']
                labels:
                  namespace: monitoring
            # Drop at scrape time — keep only query/insert/memory/replication essentials
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(ClickHouseMetrics_Query|ClickHouseMetrics_Merge|ClickHouseMetrics_MemoryTracking|ClickHouseMetrics_PartsActive|ClickHouseMetrics_ReplicatedSend|ClickHouseMetrics_ReplicatedFetch|ClickHouseMetrics_TCPConnection|ClickHouseMetrics_HTTPConnection|ClickHouseProfileEvents_InsertedRows.*|ClickHouseProfileEvents_InsertedBytes.*|ClickHouseProfileEvents_InsertQuery.*|ClickHouseProfileEvents_SelectQuery.*|ClickHouseProfileEvents_SelectedRows.*|ClickHouseProfileEvents_SelectedBytes.*|ClickHouseProfileEvents_Failed.*|ClickHouseProfileEvents_Query_total|ClickHouseProfileEvents_QueryTimeMicroseconds.*|ClickHouseProfileEvents_MergedRows.*|ClickHouseProfileEvents_MergedUncompressedBytes.*|ClickHouseProfileEvents_ReadBufferFromFileDescriptorReadBytes.*|ClickHouseProfileEvents_WriteBufferFromFileDescriptorWriteBytes.*|ClickHouseProfileEvents_ZooKeeper.*|ClickHouseAsyncMetrics_MaxPartCountForPartition|ClickHouseAsyncMetrics_TotalRowsOfMergeTreeTables|ClickHouseAsyncMetrics_TotalBytesOfMergeTreeTables.*)'
                action: keep

    # ── Gigapipe self-metrics ──
    prometheus/gigapipe:
      config:
        scrape_configs:
          - job_name: 'gigapipe-writer'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100']
                labels:
                  namespace: monitoring
          - job_name: 'gigapipe-reader-pci'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100']
                labels:
                  namespace: monitoring
          - job_name: 'gigapipe-reader-nonpci'
            scrape_interval: 30s
            static_configs:
              - targets: ['dev-monitoring-gigapipe-reader-nonpci.monitoring.svc.cluster.local:3100']
                labels:
                  namespace: monitoring

    # ── ArgoCD metrics (sync status, app health, reconciliation, redis) ──
    prometheus/argocd:
      config:
        scrape_configs:
          - job_name: 'argocd-metrics'
            scrape_interval: 30s
            static_configs:
              - targets:
                  - 'argocd-application-controller-metrics.argocd.svc.cluster.local:8082'
                  - 'argocd-server-metrics.argocd.svc.cluster.local:8083'
                  - 'argocd-repo-server-metrics.argocd.svc.cluster.local:8084'
                labels:
                  namespace: argocd
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: '(argocd_app_info|argocd_app_sync_total|argocd_app_reconcile_count|argocd_app_reconcile_bucket|argocd_app_k8s_request_total|argocd_cluster_info|argocd_cluster_events_total|argocd_git_request_total|argocd_redis_request_total|argocd_redis_request_duration_seconds_bucket|argocd_redis_request_duration_seconds_sum|argocd_redis_request_duration_seconds_count|process_cpu_seconds_total|process_resident_memory_bytes)'
                action: keep
