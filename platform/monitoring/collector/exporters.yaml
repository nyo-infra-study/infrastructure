# ============================================================
# Exporters
# ============================================================
# All signals → ClickStack's bundled OTel Collector (OTLP gRPC)
# ClickStack internally routes to its own ClickHouse for storage.
# HyperDX UI available at clickstack.localhost
# ============================================================
config:
  exporters:
    otlp/clickstack:
      endpoint: "dev-monitoring-clickstack-otel-collector.monitoring.svc.cluster.local:4317"
      tls:
        insecure: true
