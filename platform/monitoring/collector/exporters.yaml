# ============================================================
# Exporters
# ============================================================
# All signals → Gigapipe Writer (LGTM-compatible APIs)
# Gigapipe batches and writes to ClickHouse internally.
#
# Endpoints templated from: platform/monitoring/common-values.yaml
# (loaded via $values in the ArgoCD Application)
# ============================================================
config:
  exporters:
    # Traces → Gigapipe (Tempo-compatible HTTP endpoint)
    otlphttp/gigapipe-traces:
      endpoint: "{{ .Values.global.endpoints.gigapipe.writer }}"

    # Logs → Gigapipe (OTLP HTTP)
    otlphttp/gigapipe:
      endpoint: "{{ .Values.global.endpoints.gigapipe.writer }}"

    # Metrics → Gigapipe (Prometheus remote write)
    prometheusremotewrite/gigapipe:
      endpoint: "{{ .Values.global.endpoints.gigapipe.writer }}/api/prom/remote/write"
      add_metric_suffixes: false

    # ── VictoriaMetrics exporters (disabled) ──
    # Uncomment to switch to VictoriaMetrics:
    #
    # # Metrics → vmagent → VictoriaMetrics cluster
    # prometheusremotewrite/victoriametrics:
    #   endpoint: "{{ .Values.global.endpoints.victoriametrics.agent_write }}"
    #   tls:
    #     insecure: true
    #   resource_to_telemetry_conversion:
    #     enabled: true
