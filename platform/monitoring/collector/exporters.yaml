# ============================================================
# Exporters
# ============================================================
# All signals → Gigapipe Writer (LGTM-compatible APIs)
# Gigapipe batches and writes to ClickHouse internally.
#
# Also keep direct ClickHouse exporter for OTel-native tables
# (Gigapipe uses its own schema: samples_v3, tempo_traces, etc.)
# ============================================================
config:
  exporters:
    # Traces → Gigapipe (Tempo-compatible OTLP endpoint)
    otlp/gigapipe:
      endpoint: "dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100"
      tls:
        insecure: true

    # Logs → Gigapipe (Loki push API)
    otlphttp/gigapipe:
      endpoint: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100/otlp"

    # Metrics → Gigapipe (Prometheus remote write)
    prometheusremotewrite/gigapipe:
      endpoint: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100/api/v1/write"
