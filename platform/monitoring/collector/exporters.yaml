# ============================================================
# Exporters
# ============================================================
# Two destinations:
#   1. clickhouse — direct to standalone ClickHouse (row-policy multi-tenancy)
#   2. otlp/clickstack — to ClickStack's bundled OTel collector (HyperDX UI)
#
# Both receive the same data. ClickStack handles its own schema.
# ============================================================
config:
  exporters:
    # Direct to standalone ClickHouse (multi-tenant via row policies)
    clickhouse:
      endpoint: tcp://dev-monitoring-clickhouse.monitoring.svc.cluster.local:9000
      database: otel
      username: default
      password: clickhouse123
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      ttl: 72h
      timeout: 10s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s

    # To ClickStack's bundled OTel collector (feeds HyperDX UI)
    otlp/clickstack:
      endpoint: "dev-monitoring-clickstack-otel-collector.monitoring.svc.cluster.local:4317"
      tls:
        insecure: true
