# ============================================================
# Exporters
# ============================================================
# All signals → Gigapipe Writer (LGTM-compatible APIs)
# Gigapipe batches and writes to ClickHouse internally.
#
# Also keep direct ClickHouse exporter for OTel-native tables
# (Gigapipe uses its own schema: samples_v3, tempo_traces, etc.)
# ============================================================
config:
  exporters:
    # Traces → Gigapipe (Tempo-compatible HTTP endpoint)
    otlphttp/gigapipe-traces:
      endpoint: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100"

    # Logs → Gigapipe (OTLP HTTP)
    otlphttp/gigapipe:
      endpoint: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100"

    # Metrics → Gigapipe (Prometheus remote write)
    prometheusremotewrite/gigapipe:
      endpoint: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100/api/prom/remote/write"
