# ============================================================
# Exporters
# ============================================================
# All signals → ClickHouse (standalone, row-policy multi-tenancy)
# ============================================================
config:
  exporters:
    clickhouse:
      endpoint: tcp://dev-monitoring-clickhouse.monitoring.svc.cluster.local:9000
      database: otel
      username: default
      password: clickhouse123
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      ttl: 72h
      timeout: 10s
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
