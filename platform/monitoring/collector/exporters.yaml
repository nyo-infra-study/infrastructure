# ============================================================
# Exporters
# ============================================================
# Single ClickHouse exporter writing to one database (otel).
# Multi-tenancy is handled by row policies in ClickHouse,
# not by separate databases or routing.
#
# The clickhouse exporter auto-creates OTel tables on first write:
#   otel_logs, otel_traces, otel_metrics_gauge,
#   otel_metrics_sum, otel_metrics_histogram
# ============================================================
config:
  exporters:
    clickhouse:
      endpoint: tcp://dev-monitoring-clickhouse.monitoring.svc.cluster.local:9000?database=otel
      username: default
      password: clickhouse123
      database: otel
      logs_table_name: otel_logs
      traces_table_name: otel_traces
      ttl: 72h
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
