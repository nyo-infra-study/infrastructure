# ============================================================
# Service Pipelines
# ============================================================
# Dual-write: LGTM stack + ClickHouse
# LGTM for native Grafana experience, ClickHouse for SQL analytics.
# ============================================================
config:
  service:
    telemetry:
      metrics:
        address: 0.0.0.0:8888
        level: normal

    pipelines:
      # ── Infrastructure metrics ──
      metrics/self:
        receivers: [prometheus/self]
        processors: [memory_limiter, resource/self, resource/infra-scope, batch]
        exporters: [clickhouse]
      metrics/cadvisor:
        receivers: [prometheus/cadvisor]
        processors: [memory_limiter, resource/cadvisor, resource/infra-scope, filter/infra-allow, batch]
        exporters: [clickhouse]
      metrics/kubelet:
        receivers: [prometheus/kubelet]
        processors: [memory_limiter, resource/kubelet, resource/infra-scope, batch]
        exporters: [clickhouse]
      metrics/node-exporter:
        receivers: [prometheus/node-exporter]
        processors: [memory_limiter, resource/node-exporter, resource/infra-scope, batch]
        exporters: [clickhouse]
      metrics/ksm:
        receivers: [prometheus/ksm]
        processors: [memory_limiter, resource/ksm, resource/infra-scope, filter/infra-allow, batch]
        exporters: [clickhouse]
      metrics/coredns:
        receivers: [prometheus/coredns]
        processors: [memory_limiter, resource/coredns, resource/infra-scope, batch]
        exporters: [clickhouse]

      # ── Blackbox probes (uptime checks) ──
      metrics/blackbox:
        receivers: [prometheus/blackbox]
        processors: [memory_limiter, resource/blackbox, resource/infra-scope, batch]
        exporters: [clickhouse]

      # ── ArgoCD metrics ──
      metrics/argocd:
        receivers: [prometheus/argocd]
        processors: [memory_limiter, resource/argocd, resource/infra-scope, batch]
        exporters: [clickhouse]

      # ── App metrics from OTLP (backend-server, etc.) ──
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource/app-enforce, filter/metrics, batch]
        exporters: [clickhouse]

      # ── Traces ──
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource/app-enforce, batch]
        exporters: [clickhouse]

      # ── Logs from OTLP (app instrumentation) ──
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource/app-enforce, batch]
        exporters: [clickhouse]

      # ── Logs from pod files (all system pods) ──
      logs/filelog:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, filter/logs, batch]
        exporters: [clickhouse]
