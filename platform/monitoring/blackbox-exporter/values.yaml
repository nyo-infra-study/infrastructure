# ============================================================
# Blackbox Exporter — Uptime Probing (Local Dev)
# ============================================================
# Chart: prometheus-community/prometheus-blackbox-exporter
# Probes HTTP/TCP endpoints and exposes probe_success metrics.
# Used by ArgoCD dashboard for "Uptime" panel.
# ============================================================

replicas: 1

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    memory: 64Mi

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 301, 302, 307]
        follow_redirects: true
        preferred_ip_protocol: "ip4"
    tcp_connect:
      prober: tcp
      timeout: 5s

serviceMonitor:
  enabled: false
