# ============================================================
# VPA Policies for OpenSearch Stack
# ============================================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-opensearch
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: opensearch-cluster-master
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: opensearch
        minAllowed:
          cpu: 100m
          memory: 1Gi
        maxAllowed:
          cpu: "2"
          memory: 4Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-opensearch-dashboards
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-opensearch-dashboards
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: opensearch-dashboards
        minAllowed:
          cpu: 50m
          memory: 256Mi
        maxAllowed:
          cpu: "1"
          memory: 1Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-data-prepper
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-opensearch-data-prepper
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: data-prepper
        minAllowed:
          cpu: 100m
          memory: 512Mi
        maxAllowed:
          cpu: "1"
          memory: 2Gi
