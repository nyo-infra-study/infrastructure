# VPA Policy for Grafana
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-grafana
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-grafana
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: grafana
        minAllowed:
          cpu: 10m
          memory: 128Mi
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: 500m
          memory: 512Mi
