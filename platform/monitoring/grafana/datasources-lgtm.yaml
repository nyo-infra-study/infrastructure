# ============================================================
# Grafana Datasources — LGTM Backend (Prometheus + Loki + Tempo)
# ============================================================
# Use with: -f grafana-base-values.yaml -f datasources-lgtm.yaml
#
# Datasources:
#   - Prometheus → dev-lgtm-prometheus-server
#   - Loki       → dev-lgtm-loki
#   - Tempo      → dev-lgtm-tempo
#   - Pyroscope  → dev-pyroscope
# ============================================================

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://dev-lgtm-prometheus-server.monitoring.svc.cluster.local:80
        isDefault: true
        access: proxy
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: trace_id

      - name: Loki
        type: loki
        uid: loki
        url: http://dev-lgtm-loki.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://dev-lgtm-tempo.monitoring.svc.cluster.local:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: true
            filterBySpanID: false
            tags:
              - key: "service.name"
                value: "service_name"
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: "service.name"
                value: "service_name"
          tracesToProfiles:
            datasourceUid: pyroscope
            tags:
              - key: "service.name"
                value: "service_name"
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://dev-pyroscope.monitoring.svc.cluster.local:4040
        access: proxy
