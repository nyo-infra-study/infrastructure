# ============================================================
# Grafana Datasources — Gigapipe Backend
# ============================================================
# Use with: -f grafana-base-values.yaml -f datasources-gigapipe.yaml
#
# Datasources:
#   - Prometheus     → Reader PCI (metrics are the same for both users)
#   - Tempo          → Reader PCI (traces are the same for both users)
#   - Loki (PCI)     → Reader PCI (all logs including PCI)
#   - Loki (Non-PCI) → Reader Non-PCI (PCI logs filtered out)
#   - Pyroscope      → Reader PCI (profiles)
#
# Only logs differ between PCI and Non-PCI. Metrics and traces
# are unrestricted for both ClickHouse users.
# ============================================================

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # ── Metrics (single source, no PCI restriction) ──
      - name: "Prometheus"
        type: prometheus
        uid: prometheus
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        isDefault: true
        access: proxy
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: trace_id

      # ── Traces (single source, no PCI restriction) ──
      - name: "Tempo"
        type: tempo
        uid: tempo
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki-pci
            filterByTraceID: true
            filterBySpanID: true
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: service_name
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

      # ── Logs PCI (all logs, including PCI-scoped) ──
      - name: "Loki (PCI)"
        type: loki
        uid: loki-pci
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      # ── Logs Non-PCI (PCI logs hidden by ClickHouse row policy) ──
      - name: "Loki (Non-PCI)"
        type: loki
        uid: loki-nonpci
        url: http://dev-monitoring-gigapipe-reader-nonpci.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: trace_id
              url: '$${__value.raw}'

      # ── Profiles (continuous profiling via Gigapipe's Pyroscope API) ──
      - name: "Pyroscope"
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100
        access: proxy
