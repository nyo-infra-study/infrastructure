apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

# Backend-agnostic dashboards (PromQL-based, work with any metrics backend)
configMapGenerator:
  - name: grafana-dashboard-argocd
    files:
      - argocd.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: grafana-dashboard-kubernetes
    files:
      - kubernetes.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: grafana-dashboard-node
    files:
      - node.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: grafana-dashboard-pipeline-flow
    files:
      - pipeline-flow.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
