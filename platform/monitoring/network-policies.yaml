# ============================================================
# Network Policies — Monitoring Namespace
# ============================================================
# Restricts traffic to/from monitoring workloads.
# Applied via ArgoCD app (monitoring-network-policies).
#
# NOTE: DNS egress uses open port rules (no `to:` restriction)
# because ClusterIP-based DNS (10.43.0.10) doesn't match pod
# selectors in k3d/k3s network policy implementations.
# ============================================================

# --- OTel Collector ---
# Ingress: OTLP from app namespaces, Prometheus scrape from itself
# Egress: to K8s API (scraping), ClickStack collector, DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OTLP from dev namespace (backend-server)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dev
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Self-scrape (prometheus/self on :8888)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 8888
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API server (for prometheus scraping cadvisor/ksm)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # KSM metrics
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - protocol: TCP
          port: 8080
    # Node exporter metrics
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus-node-exporter
      ports:
        - protocol: TCP
          port: 9100
    # SkyWalking OAP (forward telemetry via OTLP HTTP)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 12800
        - protocol: TCP
          port: 11800
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
# --- Kube State Metrics ---
# Ingress: from OTel collector (scraping)
# Egress: to K8s API (watches resources)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# --- Node Exporter ---
# Ingress: from OTel collector (scraping)
# Egress: none (only reads host metrics)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-node-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 9100
  egress: []
---
# --- Radar ---
# Ingress: from traefik (UI access)
# Egress: to K8s API (cluster visibility), DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radar
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radar
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik ingress
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 9280
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API (cluster visibility)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# --- VPA components ---
# Ingress: admission webhook from API server
# Egress: to K8s API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpa
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vertical-pod-autoscaler
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API server calls admission webhook
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8443
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
