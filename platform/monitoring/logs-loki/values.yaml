# ============================================================
# Loki — Log Aggregation (Thin Config)
# ============================================================
loki:
  enabled: true
  image:
    tag: 2.9.3

  persistence:
    enabled: true
    size: 512Mi # Reduced from 5Gi to save laptop space

  config:
    limits_config:
      retention_period: 24h
    compactor:
      working_directory: /data/retention
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

promtail:
  enabled: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: GOMAXPROCS
      value: "1"
  initContainer:
    - name: increase-fd-ulimit
      image: busybox
      command: ['sh', '-c', 'ulimit -n 65536']
      securityContext:
        privileged: true
  config:
    clients:
      - url: http://dev-monitoring-loki-loki:3100/loki/api/v1/push
    limits_config:
      readline_rate_enabled: true
      readline_rate: 100
      readline_burst: 200
    positions:
      filename: /run/promtail/positions.yaml
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: (dev|default|monitoring)
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

grafana:
  enabled: false
