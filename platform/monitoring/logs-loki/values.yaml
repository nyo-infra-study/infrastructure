# ============================================================
# Loki — Log Aggregation (Thin Config)
# ============================================================
loki:
  enabled: true
  image:
    tag: 2.9.3

  persistence:
    enabled: true
    size: 512Mi # Reduced from 5Gi to save laptop space

  config:
    limits_config:
      retention_period: 24h
    compactor:
      working_directory: /data/retention
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

promtail:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # Raise the file descriptor limit on the Promtail container itself
  extraContainers: []
  podAnnotations:
    promtail.io/max-fd: "65536"
  config:
    clients:
      - url: http://dev-monitoring-loki-loki:3100/loki/api/v1/push
    limits_config:
      readline_rate_enabled: true
      readline_rate: 100
      readline_burst: 200
    positions:
      filename: /run/promtail/positions.yaml
    # Override default scrape_configs to only watch specific namespaces
    # This drastically reduces the number of open file handles
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: (dev|default)
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

grafana:
  enabled: false
