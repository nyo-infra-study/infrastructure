apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-datasource-prometheus
  namespace: monitoring
  labels:
    perses.dev/resource: "true"
data:
  datasource-prometheus.json: |-
    {
      "kind": "Datasource",
      "metadata": {
        "name": "prometheus",
        "project": "default"
      },
      "spec": {
        "default": true,
        "plugin": {
          "kind": "PrometheusDatasource",
          "spec": {
            "directUrl": "http://dev-lgtm-prometheus-server.monitoring.svc.cluster.local:80"
          }
        }
      }
    }
---
