apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-global-datasource-prometheus
  namespace: monitoring
  labels:
    perses.dev/resource: "true"
data:
  global-datasource-prometheus.json: |-
    {
      "kind": "GlobalDatasource",
      "metadata": {
        "name": "prometheus"
      },
      "spec": {
        "default": true,
        "plugin": {
          "kind": "PrometheusDatasource",
          "spec": {
            "proxy": {
              "kind": "HTTPProxy",
              "spec": {
                "url": "http://dev-lgtm-prometheus-server.monitoring.svc.cluster.local:80"
              }
            }
          }
        }
      }
    }
---
