# ============================================================
# Mimir — Distributed Mode (Local Dev)
# ============================================================
# Uses the grafana/mimir-distributed chart.
#
# Prometheus-compatible remote_write endpoint:
#   http://dev-monitoring-mimir-nginx.monitoring.svc.cluster.local:80/api/v1/push
#
# Grafana data source (Prometheus type):
#   http://dev-monitoring-mimir-nginx.monitoring.svc.cluster.local:80/prometheus
# ============================================================

mimir:
  structuredConfig:
    # Disable usage reporting to Grafana Cloud
    usage_stats:
      enabled: false

# Deploy MinIO (object storage) because distributed mode requires shared storage
minio:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Scale down components to 1 replica since we are running locally
alertmanager:
  replicas: 1
compactor:
  replicas: 1
distributor:
  replicas: 1
ingester:
  replicas: 1
querier:
  replicas: 1
query_frontend:
  replicas: 1
ruler:
  replicas: 1
store_gateway:
  replicas: 1
nginx:
  replicas: 1

# Reduce default resource requests to save local k3d memory
global:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
