# ============================================================
# Mimir — Distributed Mode (Thin Local Dev)
# ============================================================
mimir:
  structuredConfig:
    usage_stats:
      enabled: false
    # Enable 24h retention policy for metrics (Mimir 2.x/5.5.x schema)
    limits:
      compactor_retention_period: 24h
    compactor:
      retention_enabled: true

# Deploy MinIO (object storage)
minio:
  enabled: true
  persistence:
    size: 512Mi # Limited MinIO storage to save laptop disk
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Component Scaling (Small Footprint)
alertmanager:
  replicas: 1
compactor:
  replicas: 1
distributor:
  replicas: 1
ingester:
  replicas: 1
querier:
  replicas: 1
query_frontend:
  replicas: 1
ruler:
  replicas: 1
store_gateway:
  replicas: 1
nginx:
  replicas: 1

global:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
