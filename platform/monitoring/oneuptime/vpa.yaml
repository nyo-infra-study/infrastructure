# ============================================================
# VPA Policies for OneUptime (Local Dev)
# ============================================================
# Co-located with OneUptime values for discoverability.
# Mode: Auto — VPA adjusts requests in-place (k8s 1.33+) or via eviction.
#
# minAllowed = floor (don't starve the pod)
# maxAllowed = ceiling (matches limits in values.yaml — 3x steady usage)
#
# Observed steady-state usage:
#   App:        ~1000m CPU / ~900Mi mem
#   Nginx:      ~50m CPU / ~500Mi mem
#   Probe:      ~300m CPU / ~400Mi mem
#   ClickHouse: ~100m CPU / ~700Mi mem
# ============================================================
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-oneuptime-app
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-monitoring-oneuptime-app
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 200m
          memory: 512Mi
        maxAllowed:
          cpu: 3000m
          memory: 3072Mi
        controlledResources: ["cpu", "memory"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-oneuptime-nginx
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-monitoring-oneuptime-nginx
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 50m
          memory: 256Mi
        maxAllowed:
          cpu: 1500m
          memory: 1536Mi
        controlledResources: ["cpu", "memory"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-oneuptime-probe
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-monitoring-oneuptime-probe-one
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 1000m
          memory: 1280Mi
        controlledResources: ["cpu", "memory"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-oneuptime-clickhouse
  namespace: monitoring
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: dev-monitoring-oneuptime-clickhouse-shard0
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 100m
          memory: 512Mi
        maxAllowed:
          cpu: 1500m
          memory: 1536Mi
        controlledResources: ["cpu", "memory"]
