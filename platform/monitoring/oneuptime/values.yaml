# ============================================================
# OneUptime — Complete Observability Platform (Local Dev)
# ============================================================
# Chart: https://helm-chart.oneuptime.com (oneuptime/oneuptime)
# Docs:  https://oneuptime.com/docs
#
# Provides: Monitoring, Incident Management, Status Pages,
#           On-Call, Logs, Traces, Metrics, Dashboards
#
# UI accessible at: http://oneuptime.localhost
# OTLP endpoint (from within cluster):
#   gRPC: dev-monitoring-oneuptime.monitoring.svc.cluster.local:4317
# ============================================================

# --- Host & Protocol ---
host: oneuptime.localhost
httpProtocol: http

# --- Image ---
image:
  registry: docker.io
  repository: oneuptime
  tag: "10.0.89"
  pullPolicy: IfNotPresent
  type: community-edition

# --- Deployment ---
deployment:
  replicaCount: 1

# --- App (main OneUptime server — Node.js) ---
# Reduced concurrency to lower memory footprint for local dev.
# Default is 100 each — way too much for a single-node setup.
# VPA will auto-adjust requests based on actual usage.
# Limits set to ~3x steady usage for boot spikes.
app:
  workerConcurrency: 10
  telemetryConcurrency: 10
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 3000m
      memory: 3072Mi

# --- Nginx / Ingress Gateway ---
# OneUptime's "nginx" is a Node.js process.
# VPA will right-size requests after observing usage.
nginx:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  service:
    type: ClusterIP

# --- Probes ---
# VPA will right-size requests after observing usage.
probes:
  one:
    name: "Probe"
    description: "Probe"
    monitoringWorkers: 1
    monitorFetchLimit: 5
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 1280Mi

# --- PostgreSQL (built-in) ---
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    database: oneuptimedb
    postgresPassword: oneuptime-dev-password
  primary:
    service:
      type: ClusterIP
      ports:
        postgresql: "5432"
    terminationGracePeriodSeconds: 0
    persistence:
      enabled: true
      size: 512Mi
      storageClass: "local-path"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

# --- Redis (built-in) ---
redis:
  enabled: true
  auth:
    password: oneuptime-redis-dev
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  master:
    service:
      type: ClusterIP
      ports:
        redis: "6379"
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 11m
        memory: 31Mi
      limits:
        cpu: 200m
        memory: 128Mi
  commonConfiguration: |-
    appendonly no
    save ""

# --- ClickHouse (for logs, traces, metrics) ---
# Observed usage: ~39m CPU, ~676Mi memory
clickhouse:
  enabled: true
  auth:
    username: oneuptime
    password: oneuptime-ch-dev
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    ports:
      http: "8123"
      tcp: "9000"
  persistence:
    enabled: true
    size: 512Mi
    storageClass: "local-path"
  resources:
    requests:
      cpu: 100m
      memory: 676Mi
    limits:
      cpu: 1000m
      memory: 1280Mi

# --- Global ---
global:
  storageClass: "local-path"

# --- Logging ---
logLevel: INFO

# --- Disable autoscaling for local dev ---
autoscaling:
  enabled: false
