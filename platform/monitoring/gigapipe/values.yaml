# ============================================================
# Gigapipe — LGTM-compatible Observability (Local Dev)
# ============================================================
# Image: ghcr.io/metrico/gigapipe
# Two instances sharing the same ClickHouse:
#
#   1. Writer (MODE=all, user=default)
#      - Accepts writes from OTel Collector
#      - Reads all data (PCI + non-PCI)
#      - Grafana "PCI" datasource points here
#      - URL: gigapipe.localhost
#
#   2. Reader (MODE=reader, user=user_nonpci)
#      - Read-only, sees only compliance.scope = 'non-pci'
#      - Grafana "Non-PCI" datasource points here
#      - URL: gigapipe-nonpci.localhost
# ============================================================

image:
  repository: ghcr.io/metrico/gigapipe
  tag: "v4.1.6"
  pullPolicy: IfNotPresent

# Gigapipe 1: Full access (write + read)
writer:
  enabled: true
  replicas: 1
  mode: "all"
  port: 3100
  clickhouse:
    server: "dev-monitoring-clickhouse"
    port: "9000"
    auth: "default:clickhouse123"
    db: "otel"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    host: "gigapipe.localhost"

# Gigapipe 2: Non-PCI read-only
reader:
  enabled: true
  replicas: 1
  mode: "reader"
  port: 3100
  clickhouse:
    server: "dev-monitoring-clickhouse"
    port: "9000"
    auth: "user_nonpci:nonpci_pass"
    db: "otel"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    host: "gigapipe-nonpci.localhost"
