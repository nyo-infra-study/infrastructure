# ============================================================
# Global Monitoring Configuration
# ============================================================
# Use these values across all monitoring components to ensure
# consistency and prevent DNS mismatches.

global:
  monitoring:
    # OTel Collector (scrapes infra metrics/logs, forwards to LGTM stack)
    otel:
      grpc_endpoint: "dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4317"
      http_endpoint: "dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4318"

    # LGTM Stack endpoints
    prometheus: "dev-lgtm-prometheus-server.monitoring.svc.cluster.local:80"
    loki: "dev-lgtm-loki.monitoring.svc.cluster.local:3100"
    tempo: "dev-lgtm-tempo.monitoring.svc.cluster.local:3200"
    grafana: "dev-lgtm-grafana.monitoring.svc.cluster.local:80"
    pyroscope: "dev-pyroscope.monitoring.svc.cluster.local:4040"
