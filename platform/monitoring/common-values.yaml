# ============================================================
# Global Monitoring Configuration
# ============================================================
# Use these values across all monitoring components to ensure
# consistency and prevent DNS mismatches.

global:
  monitoring:
    # SigNoz (Unified Observability — Metrics, Logs, Traces)
    signoz:
      ui: "http://dev-monitoring-signoz-signoz.monitoring.svc.cluster.local:8080"
      otel_grpc: "dev-monitoring-signoz-otel-collector.monitoring.svc.cluster.local:4317"
      otel_http: "dev-monitoring-signoz-otel-collector.monitoring.svc.cluster.local:4318"

    # OTel Collector (External Gateway — scrapes infra metrics, forwards to SigNoz)
    otel:
      endpoint: "http://dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4317"
      http_endpoint: "http://dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4318"
