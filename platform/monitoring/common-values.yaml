# ============================================================
# Shared Monitoring Endpoints (Single Source of Truth)
# ============================================================
# All monitoring service URLs in one place.
#
# HOW TO USE:
#
# 1. In ArgoCD Application (multi-source with $values ref):
#    helm:
#      valueFiles:
#        - $values/platform/monitoring/common-values.yaml
#
# 2. In Helm templates:
#    {{ .Values.global.endpoints.gigapipe.writer }}
#    {{ .Values.global.endpoints.otel.grpc }}
#
# 3. In ArgoCD valuesObject (copy the value):
#    monitoring:
#      pyroscope:
#        url: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100"
#
# WHEN TO EDIT: Service renamed, port changed, or new service added.
# THEN UPDATE:
#   Templated (auto-resolved via {{ .Values.global.endpoints.* }}):
#   - platform/monitoring/collector/exporters.yaml ✅
#   - platform/monitoring/collector/receivers-apps.yaml (partial) ✅
#   - apps/dev/4-apps/backend-server.yaml (via chart values) ✅
#
#   Hardcoded (manual find-and-replace):
#   - platform/monitoring/grafana-gigapipe/grafana-values.yaml
#   - platform/monitoring/pyroscope/values.yaml (Alloy config block)
#   - platform/monitoring/collector/receivers-blackbox.yaml
#   - platform/monitoring/collector/receivers-infra.yaml
# ============================================================

global:
  # Namespace where monitoring stack runs
  namespace: monitoring

  endpoints:
    # ── Gigapipe (all-in-one observability backend) ──
    gigapipe:
      writer: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100"
      reader_pci: "http://dev-monitoring-gigapipe-reader-pci.monitoring.svc.cluster.local:3100"
      reader_nonpci: "http://dev-monitoring-gigapipe-reader-nonpci.monitoring.svc.cluster.local:3100"

    # ── OTel Collector (telemetry ingest) ──
    otel:
      grpc: "dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4317"
      http: "dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4318"

    # ── ClickHouse (storage) ──
    clickhouse:
      host: "dev-monitoring-clickhouse.monitoring.svc.cluster.local"
      port: "9000"
      http_port: "8123"

    # ── Grafana (UI) ──
    grafana: "http://dev-grafana-gigapipe.monitoring.svc.cluster.local:80"

    # ── Pyroscope-compatible profiling (via Gigapipe) ──
    pyroscope: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100"

    # ── VictoriaMetrics Stack (Cluster Mode) ──
    victoriametrics:
      # vminsert — write endpoint (Prometheus remote_write compatible)
      write: "http://dev-vm-victoria-metrics-cluster-vminsert.monitoring.svc.cluster.local:8480/insert/0/prometheus/api/v1/write"
      # vmselect — read endpoint (PromQL/MetricsQL)
      read: "http://dev-vm-victoria-metrics-cluster-vmselect.monitoring.svc.cluster.local:8481/select/0/prometheus"
      # vmagent — accepts remote_write from OTel Collector
      agent: "http://dev-vmagent-victoria-metrics-agent.monitoring.svc.cluster.local:8429"
      agent_write: "http://dev-vmagent-victoria-metrics-agent.monitoring.svc.cluster.local:8429/api/v1/write"

    # ── VictoriaLogs ──
    victorialogs:
      server: "http://dev-vlogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428"
      # Loki-compatible push endpoint
      loki_push: "http://dev-vlogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/loki/api/v1/push"
      # OTLP logs endpoint
      otlp: "http://dev-vlogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/opentelemetry/v1/logs"
