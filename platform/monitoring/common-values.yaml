# ============================================================
# Global Monitoring Configuration
# ============================================================
# Use these values across all monitoring components to ensure
# consistency and prevent DNS mismatches.

global:
  monitoring:
    # OneUptime (Unified Observability — Metrics, Logs, Traces, Incidents)
    oneuptime:
      ui: "http://oneuptime.localhost:9000"
      otel_grpc: "dev-monitoring-oneuptime-otel.monitoring.svc.cluster.local:4317"
      otel_http: "dev-monitoring-oneuptime-otel.monitoring.svc.cluster.local:4318"

    # OTel Collector (External — scrapes infra metrics/logs, forwards to OneUptime)
    otel:
      endpoint: "http://dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4317"
      http_endpoint: "http://dev-monitoring-otel-opentelemetry-collector.monitoring.svc.cluster.local:4318"
