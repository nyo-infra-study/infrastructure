# ============================================================
# Apache SkyWalking — APM & Observability (Local Dev)
# ============================================================
# Chart: skywalking/skywalking v4.3.0
# Docs:  https://skywalking.apache.org/docs/
#
# UI accessible at: http://skywalking.localhost
#
# Using H2 embedded storage for local dev (no Elasticsearch needed).
# For production, switch to BanyanDB or Elasticsearch.
#
# OTel integration: OAP server accepts OTLP on gRPC port 11800
# ============================================================

# --- Disable Elasticsearch (use BanyanDB instead) ---
elasticsearch:
  enabled: false

# --- OAP Server (Analysis Platform) ---
oap:
  replicas: 1
  storageType: banyandb
  image:
    repository: skywalking.docker.scarf.sh/apache/skywalking-oap-server
    tag: "10.2.0"
  # BanyanDB schemas are persisted (PVC). Normal mode — no schema init needed.
  javaOpts: -Xmx768m -Xms768m
  initEs: false
  ports:
    grpc: 11800
    rest: 12800
  env:
    # Enable OTel receiver with all OTLP handlers (traces, logs, metrics)
    SW_OTEL_RECEIVER: default
    SW_OTEL_RECEIVER_ENABLED_HANDLERS: otlp-metrics,otlp-logs,otlp-traces
    # BanyanDB connection
    SW_STORAGE_BANYANDB_TARGETS: dev-monitoring-skywalking-banyandb:17912
  service:
    type: ClusterIP

# --- UI (Booster UI) ---
ui:
  replicas: 1
  image:
    repository: skywalking.docker.scarf.sh/apache/skywalking-ui
    tag: "10.2.0"
  service:
    type: ClusterIP
    externalPort: 80
    internalPort: 8080
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - skywalking.localhost
    path: /

# --- Satellite (disabled — not needed for local dev) ---
satellite:
  enabled: false
