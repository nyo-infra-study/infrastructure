# ============================================================
# Apache SkyWalking — APM & Observability (Local Dev)
# ============================================================
# Chart: skywalking/skywalking v4.3.0
# Docs:  https://skywalking.apache.org/docs/
#
# UI accessible at: http://skywalking.localhost
#
# Using Elasticsearch (chart default, production-recommended).
# ES handles schema init automatically via the initEs job.
# ============================================================

# --- Elasticsearch (bundled — single node for local dev) ---
elasticsearch:
  enabled: true
  replicas: 1
  minimumMasterNodes: 1
  # Disable PDB (uses deprecated policy/v1beta1 API removed in K8s 1.25+)
  maxUnavailable: ""
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  esJavaOpts: -Xmx1g -Xms1g
  persistence:
    enabled: true
  volumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
  # Use a newer ES version
  imageTag: "7.17.27"

# --- OAP Server (Analysis Platform) ---
oap:
  replicas: 1
  storageType: elasticsearch
  image:
    repository: skywalking.docker.scarf.sh/apache/skywalking-oap-server
    tag: "10.2.0"
  javaOpts: -Xmx768m -Xms768m
  ports:
    grpc: 11800
    rest: 12800
  env:
    # Enable OTel receiver with all OTLP handlers
    SW_OTEL_RECEIVER: default
    SW_OTEL_RECEIVER_ENABLED_HANDLERS: otlp-metrics,otlp-logs,otlp-traces
    # Enable Zipkin receiver (required for otlp-traces handler)
    SW_RECEIVER_ZIPKIN: default
    # Enable Zipkin query (required for trace viewing)
    SW_QUERY_ZIPKIN: default
  service:
    type: ClusterIP

# --- UI (Booster UI) ---
ui:
  replicas: 1
  image:
    repository: skywalking.docker.scarf.sh/apache/skywalking-ui
    tag: "10.2.0"
  service:
    type: ClusterIP
    externalPort: 80
    internalPort: 8080
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - skywalking.localhost
    path: /

# --- Satellite (disabled) ---
satellite:
  enabled: false
