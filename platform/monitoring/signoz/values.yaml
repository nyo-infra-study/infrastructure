# ============================================================
# SigNoz — Unified Observability Platform (Local Dev)
# ============================================================
# Chart: https://github.com/SigNoz/charts (signoz/signoz v0.121.0)
# Docs:  https://signoz.io/docs/install/argocd/
#
# UI accessible at: http://signoz.localhost
# SigNoz OTel Collector (from within cluster):
#   gRPC: dev-monitoring-signoz-otel-collector.monitoring.svc.cluster.local:4317
#   HTTP: dev-monitoring-signoz-otel-collector.monitoring.svc.cluster.local:4318
# ============================================================

# --- Global ---
global:
  storageClass: "local-path"
  clusterName: "dev"
  cloud: other

# --- ClickHouse ---
clickhouse:
  enabled: true
  installCustomStorageClass: false
  image:
    registry: docker.io
    repository: clickhouse/clickhouse-server
    tag: "25.5.6"
  layout:
    shardsCount: 1
    replicasCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  persistence:
    enabled: true
    size: 1Gi
  # Zookeeper — bitnami/ removed from Docker Hub Sep 2025, use bitnamilegacy/
  zookeeper:
    replicaCount: 1
    image:
      registry: docker.io
      repository: bitnamilegacy/zookeeper
      tag: "3.7.1"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# --- SigNoz Query Service + Frontend ---
signoz:
  replicaCount: 1
  additionalArgs:
    - --use-logs-new-schema=true
    - --use-trace-new-schema=true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 1Gi
  # SigNoz UI at http://signoz.localhost
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: signoz.localhost
        paths:
          - path: /
            pathType: Prefix
            port: 8080

# --- SigNoz OTel Collector ---
otelCollector:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Telemetry Store Migrator ---
telemetryStoreMigrator:
  enabled: true

# --- Disabled ---
signoz-otel-gateway:
  enabled: false
postgresql:
  enabled: false
redpanda:
  enabled: false
