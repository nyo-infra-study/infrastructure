# ============================================================
# Grafana — Unified (backend-agnostic)
# ============================================================
# Base config + datasource overlay. Currently using Gigapipe backend.
# To switch backend, change the datasource valueFile below.
# UI: http://grafana.localhost
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: dev-grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    domain: monitoring
spec:
  project: default
  sources:
    - chart: grafana
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 10.5.15
      helm:
        releaseName: dev-grafana
        valueFiles:
          - $values/platform/monitoring/grafana/grafana-base-values.yaml
          - $values/platform/monitoring/grafana/datasources-gigapipe.yaml
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      path: platform/monitoring/grafana/dashboards
      kustomize: {}
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      path: platform/monitoring/grafana
      directory:
        include: 'vpa.yaml'
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
