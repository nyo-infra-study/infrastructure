# ============================================================
# Profile Scraper — Alloy pushing to Gigapipe (Local Dev)
# ============================================================
# Replaces standalone Pyroscope. Alloy scrapes pprof endpoints
# from annotated pods and pushes profiles to Gigapipe's
# Pyroscope-compatible /ingest API. Grafana queries profiles
# from Gigapipe's reader (same URL as metrics/logs/traces).
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: dev-pyroscope
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    domain: monitoring
spec:
  project: default
  sources:
    - chart: alloy
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 1.5.2
      helm:
        releaseName: dev-pyroscope
        valueFiles:
          - $values/platform/monitoring/pyroscope/values.yaml
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      path: platform/monitoring/pyroscope
      directory:
        include: 'vpa.yaml'
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
