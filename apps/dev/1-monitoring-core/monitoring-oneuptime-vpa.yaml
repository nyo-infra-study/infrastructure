# ============================================================
# OneUptime VPA Policies
# ============================================================
# Deploys VPA objects for OneUptime workloads.
# Co-located with OneUptime values at platform/monitoring/oneuptime/
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: dev-monitoring-oneuptime-vpa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    domain: monitoring
spec:
  project: default
  source:
    repoURL: https://github.com/nyo-infra-study/infrastructure.git
    targetRevision: main
    path: platform/monitoring/oneuptime
    directory:
      include: "vpa.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
