# ============================================================
# ClickHouse — Observability Storage
# ============================================================
# Minimal single-node ClickHouse using official clickhouse-server image.
# No operators, no CRDs, no Bitnami — just a StatefulSet + Service.
# Multi-tenancy: row policies on materialized tenant_scope column.
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: dev-monitoring-clickhouse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    domain: monitoring
spec:
  project: default
  sources:
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      path: charts/clickhouse
      helm:
        releaseName: dev-monitoring-clickhouse
        valueFiles:
          - $values/platform/monitoring/clickhouse/values.yaml
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
