# ============================================================
# ClickHouse — Observability Storage
# ============================================================
# Single-node ClickHouse for storing OTel signals.
# Two databases: otel_all (everything) and otel_backend (backend only).
# Chart: bitnami/clickhouse
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: dev-monitoring-clickhouse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    domain: monitoring
spec:
  project: default
  sources:
    - chart: clickhouse
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 9.4.4
      helm:
        releaseName: dev-monitoring-clickhouse
        valueFiles:
          - $values/platform/monitoring/clickhouse/values.yaml
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
