# ============================================================
# Apache SkyWalking — APM & Observability Platform
# ============================================================
# Chart: skywalking/skywalking v4.3.0
# Storage: H2 embedded (lightweight for local dev)
# UI: http://skywalking.localhost
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: dev-monitoring-skywalking
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    domain: monitoring
spec:
  project: default
  sources:
    - chart: skywalking
      repoURL: https://apache.jfrog.io/artifactory/skywalking-helm
      targetRevision: 4.3.0
      helm:
        releaseName: dev-monitoring-skywalking
        valueFiles:
          - $values/platform/monitoring/skywalking/values.yaml

    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  # OAP needs longer probe delays for BanyanDB schema init (patched manually)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: dev-monitoring-skywalking-oap
      jqPathExpressions:
        - .spec.template.spec.containers[].livenessProbe
        - .spec.template.spec.containers[].readinessProbe
