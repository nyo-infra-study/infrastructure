# ArgoCD Application manifest for web frontend in dev environment
# This tells ArgoCD how to deploy the React frontend

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4" # Deploy with backend
  # Name of this ArgoCD Application
  name: dev-web-frontend

  # Must be in argocd namespace
  namespace: argocd
  labels:
    environment: dev
    domain: frontend
spec:
  project: default

  # SOURCE: Points to the Helm chart in Git (multi-source for shared values)
  sources:
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      path: charts/web-frontend

      helm:
        releaseName: dev-web-frontend
        valueFiles:
          - $values/platform/monitoring/common-values.yaml

        # VALUES OVERRIDES: Dev-specific configuration
        valuesObject:
          replicaCount: 1 # Single replica for local playground

          image:
            tag: "latest" # Always use latest build from main branch
            pullPolicy: Always # Force pull latest image on every deployment

          containerPort: 8080 # Go server listens on port 8080 inside container

          # Kubernetes Service configuration
          service:
            port: 9092 # External port for accessing frontend service

          # Monitoring config (endpoints resolved from common-values.yaml → global.endpoints)
          monitoring:
            otel:
              serviceName: "web-frontend"
              serviceNamespace: "dev"
              serviceVersion: "latest"
              deploymentEnvironment: "dev"
              insecure: "true"

          # Ingress: Makes frontend accessible from outside cluster
          ingress:
            enabled: true
            className: traefik # Use Traefik ingress controller (k3d default)
            hosts:
              - host: localhost
                paths:
                  - path: /web # Root path - all non-/api requests go here
                    pathType: ImplementationSpecific

    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values

  # DESTINATION: Deploy to dev namespace in local cluster
  destination:
    server: "https://kubernetes.default.svc"
    namespace: dev

  # SYNC POLICY: Auto-sync on Git changes
  syncPolicy:
    automated:
      prune: true # Remove deleted resources
      selfHeal: true # Fix manual changes
    syncOptions:
      # Auto-create the target namespace if it doesn't exist
      # Without this, you'd need to manually: kubectl create namespace dev
      - CreateNamespace=true
