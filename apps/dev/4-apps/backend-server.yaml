# ArgoCD Application manifest for backend server in dev environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: dev-backend-server
  namespace: argocd
  labels:
    environment: dev
    domain: backend
spec:
  project: default
  sources:
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      path: charts/backend-server
      helm:
        releaseName: dev-backend-server
        valueFiles:
          - $values/platform/monitoring/common-values.yaml
        valuesObject:
          replicaCount: 1
          otelServiceName: "backend-server"

          image:
            tag: "latest"
            pullPolicy: IfNotPresent

          containerPort: 9091

          # App-specific env vars (non-monitoring)
          env:
            - name: PORT
              value: "9091"
            - name: DB_HOST
              value: "backend-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "myuser"
            - name: DB_NAME
              value: "mydb"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-db-secret
                  key: POSTGRES_PASSWORD

          # Monitoring config (uses endpoints from common-values.yaml global.endpoints)
          monitoring:
            otel:
              endpoint: "http://dev-monitoring-otel-opentelemetry-collector-agent.monitoring.svc.cluster.local:4317"
              serviceName: "backend-server"
              serviceNamespace: "dev"
              serviceVersion: "latest"
              deploymentEnvironment: "dev"
              resourceAttributes: "compliance.scope=pci"
              insecure: "true"
            pyroscope:
              url: "http://dev-monitoring-gigapipe-writer.monitoring.svc.cluster.local:3100"

          service:
            port: 9091

          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: localhost
                paths:
                  - path: /api
                    pathType: ImplementationSpecific

    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values

  destination:
    server: "https://kubernetes.default.svc"
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
