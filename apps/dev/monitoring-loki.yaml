apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-monitoring-loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    domain: monitoring
spec:
  project: default
  source:
    chart: loki-stack
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 0.80.6
    helm:
      releaseName: dev-monitoring-loki
      valueFiles:
        - $values/platform/monitoring/logs-loki/values.yaml

  # Additional source to get the values file from our git repo
  sources:
    - chart: loki-stack
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 0.80.6
      helm:
        releaseName: dev-monitoring-loki
        valueFiles:
          - $values/platform/monitoring/logs-loki/values.yaml
    - repoURL: https://github.com/nyo-infra-study/infrastructure.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
