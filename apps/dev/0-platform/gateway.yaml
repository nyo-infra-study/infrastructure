# ============================================================
# Gateway Routes — HTTPRoutes for platform services
# ============================================================
# Deploys HTTPRoutes for services not managed by app Helm charts
# (ArgoCD, Grafana, Radar, Traefik dashboard).
# The Gateway itself is created by the Traefik Helm chart.
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # After Traefik (-1), before apps
  name: gateway-routes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nyo-infra-study/infrastructure.git
    targetRevision: main
    path: platform/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
