# ============================================================
# Gateway — Centralized traffic entry point
# ============================================================
# Deploys the main Gateway resource that all HTTPRoutes attach to.
# Must deploy AFTER Traefik (which creates the GatewayClass).
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # After Traefik (-1), before apps
  name: main-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nyo-infra-study/infrastructure.git
    targetRevision: main
    path: platform/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
