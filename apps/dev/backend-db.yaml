apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: backend-db


  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: charts/backend-db
    repoURL: https://github.com/nyo-infra-study/infrastructure
    targetRevision: main
    helm:
      releaseName: backend-db
      valuesObject:
        postgresql:
          # Local playground: standalone mode, no replication overhead
          architecture: standalone
          auth:
            existingSecret: "backend-db-secret"
            secretKeys:
              adminPasswordKey: "POSTGRES_PASSWORD"
              userPasswordKey: "POSTGRES_PASSWORD"
              replicationPasswordKey: "POSTGRES_PASSWORD"
          primary:
            persistence:
              size: 512Mi
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "300m"
                memory: "256Mi"
          readReplicas:
            replicaCount: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
