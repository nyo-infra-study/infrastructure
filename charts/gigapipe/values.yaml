image:
  repository: ghcr.io/metrico/gigapipe
  tag: "v4.1.6"
  pullPolicy: IfNotPresent

# Gigapipe Writer: MODE=writer (ingest only, no read queries)
writer:
  enabled: true
  replicas: 1
  mode: "writer"
  port: 3100
  clickhouse:
    server: "dev-monitoring-clickhouse"
    port: "9000"
    auth: "default:clickhouse123"
    db: "otel"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: true
    host: "gigapipe.localhost"

# Gigapipe Reader PCI: MODE=reader (full access, all signals)
readerPci:
  enabled: true
  replicas: 1
  mode: "reader"
  port: 3100
  clickhouse:
    server: "dev-monitoring-clickhouse"
    port: "9000"
    auth: "user_all:all_pass"
    db: "otel"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: true
    host: "gigapipe-pci.localhost"

# Gigapipe Reader Non-PCI: MODE=reader (all metrics + traces, PCI logs hidden)
readerNonpci:
  enabled: true
  replicas: 1
  mode: "reader"
  port: 3100
  clickhouse:
    server: "dev-monitoring-clickhouse"
    port: "9000"
    auth: "user_nonpci:nonpci_pass"
    db: "otel"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: true
    host: "gigapipe-nonpci.localhost"
