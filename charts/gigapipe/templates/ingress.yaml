{{- if and .Values.writer.enabled .Values.writer.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-writer
  labels:
    app.kubernetes.io/name: gigapipe
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: writer
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.writer.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-writer
                port:
                  number: {{ .Values.writer.port }}
---
{{- end }}
{{- if and .Values.readerPci.enabled .Values.readerPci.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
