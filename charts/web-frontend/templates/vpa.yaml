apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-{{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Release.Name }}
        minAllowed:
          cpu: 1m
          memory: 8Mi
        maxAllowed:
          cpu: 100m
          memory: 64Mi
