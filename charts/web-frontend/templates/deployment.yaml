apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
        app.kubernetes.io/component: "frontend"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.containerPort }}"
        prometheus.io/path: "/metrics"
        resource.opentelemetry.io/service.name: {{ .Values.monitoring.otel.serviceName | default .Release.Name }}
        resource.opentelemetry.io/service.version: {{ .Values.image.tag | quote }}
        resource.opentelemetry.io/deployment.environment: {{ .Values.monitoring.otel.deploymentEnvironment | default "dev" | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              value: "{{ .Values.containerPort }}"
            - name: BASE_PATH
              value: "/"
            - name: STATIC_DIR
              value: "/app/static"
            - name: BACKEND_URL
              value: "http://dev-backend-server.dev.svc.cluster.local:9091"
            - name: READY_PROBES
              value: ""  # No upstream dependency checks — frontend serves static files independently
            {{- $otelEndpoint := .Values.monitoring.otel.endpoint | default (printf "http://%s" (index .Values.global "endpoints" "otel" "grpc" | default "")) }}
            {{- if $otelEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otelEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.monitoring.otel.serviceName | default .Release.Name | quote }}
            - name: OTEL_SERVICE_NAMESPACE
              value: {{ .Values.monitoring.otel.serviceNamespace | quote }}
            - name: OTEL_SERVICE_VERSION
              value: {{ .Values.monitoring.otel.serviceVersion | default .Values.image.tag | quote }}
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.monitoring.otel.deploymentEnvironment | quote }}
            {{- if .Values.monitoring.otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.monitoring.otel.resourceAttributes | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.monitoring.otel.insecure | default "true" | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
