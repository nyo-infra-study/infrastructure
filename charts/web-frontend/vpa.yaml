# VPA Policy for Web Frontend
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-web-frontend
  namespace: dev
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-web-frontend
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: dev-web-frontend
        minAllowed:
          cpu: 5m
          memory: 8Mi
        maxAllowed:
          cpu: 200m
          memory: 128Mi
