apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-tenant-backfill
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backfill
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backfill
              image: clickhouse/clickhouse-server:25.7.8-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  clickhouse-client \
                    --host={{ .Release.Name }} \
                    --port=9000 \
                    --user=default \
                    --password={{ .Values.auth.defaultPassword }} \
                    --query="ALTER TABLE otel.samples_v3 UPDATE tenant_scope = (SELECT tenant_scope FROM otel.fingerprint_tenant_map WHERE fingerprint = otel.samples_v3.fingerprint LIMIT 1) WHERE tenant_scope = '' AND fingerprint IN (SELECT fingerprint FROM otel.fingerprint_tenant_map WHERE tenant_scope != '')"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
