# Default values for backend-db.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  security:
    allowInsecureImages: true

postgresql:
  # Standalone for local dev (override to 'replication' for prod)
  architecture: standalone

  # Image configuration
  image:
    repository: bitnamilegacy/postgresql
    tag: 16-debian-12

  # Authentication
  auth:
    database: "mydb"
    username: "myuser"
    password: "mypassword"
    # For replication
    replicationUsername: "repl_user"
    replicationPassword: "repl_password"
    # Use existing secret if available
    # existingSecret: "my-existing-secret"

  # Primary configuration
  primary:
    persistence:
      enabled: true
      size: 512Mi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

    # Initialize database with schema
    initdb:
      scripts:
        init.sql: |
          CREATE TABLE IF NOT EXISTS messages (
            id SERIAL PRIMARY KEY,
            name VARCHAR(255),
            message TEXT
          );
          INSERT INTO messages (name, message) VALUES ('Infrastructure', 'Hello from Kubernetes!') ON CONFLICT DO NOTHING;

  # Read Replicas configuration
  readReplicas:
    replicaCount: 0
    persistence:
      enabled: true
      size: 512Mi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    service:
      type: ClusterIP
      ports:
        postgresql: 5432

  # Common configuration
  fullnameOverride: "backend-db"
