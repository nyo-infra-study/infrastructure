apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  
  # Selector: Which pods this Deployment manages
  selector:
    matchLabels:
      app: {{ .Release.Name }}  # Must match template.metadata.labels
  
  # Template: Blueprint for each pod
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}  # Pod label (must match selector)
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
        app.kubernetes.io/component: "backend"
      annotations:
        # OTel resource attributes — picked up by k8sattributes processor
        resource.opentelemetry.io/service.name: {{ .Values.otelServiceName | default .Release.Name }}
        resource.opentelemetry.io/service.version: {{ .Values.image.tag | quote }}
        resource.opentelemetry.io/deployment.environment: {{ .Values.environment | default "dev" | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser | default 10001 }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup | default 10001 }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup | default 10001 }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          
          # Environment variables (only rendered if .Values.env is set)
          env:
            {{- with .Values.env | default list }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.monitoring.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.monitoring.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.monitoring.otel.serviceName | default .Release.Name | quote }}
            - name: OTEL_SERVICE_NAMESPACE
              value: {{ .Values.monitoring.otel.serviceNamespace | quote }}
            - name: OTEL_SERVICE_VERSION
              value: {{ .Values.monitoring.otel.serviceVersion | default .Values.image.tag | quote }}
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.monitoring.otel.deploymentEnvironment | quote }}
            {{- if .Values.monitoring.otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.monitoring.otel.resourceAttributes | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.monitoring.otel.insecure | default "true" | quote }}
            {{- end }}
            {{- if .Values.monitoring.pyroscope.url }}
            - name: PYROSCOPE_URL
              value: {{ .Values.monitoring.pyroscope.url | quote }}
            {{- end }}
          
          # Container port (Go server listens here)
          ports:
            - containerPort: {{ .Values.containerPort }}
          
          # Liveness Probe: Restarts pod if unhealthy
          # Checks /api/healthz endpoint
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 5  # Wait 5s before first check
            periodSeconds: 10       # Check every 10s
          
          # Readiness Probe: Removes pod from Service if not ready
          # Checks /api/readyz endpoint
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: {{ .Values.containerPort }}
            initialDelaySeconds: 3  # Wait 3s before first check
            periodSeconds: 5        # Check every 5s
          
          # Resource limits (CPU/Memory)
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          # Writable volume for temp files (needed with readOnlyRootFilesystem)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
